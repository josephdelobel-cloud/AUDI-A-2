<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Audi A2 e-tron • Autoroute 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#u{position:absolute;top:16px;left:16px;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);color:#fff;padding:12px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.25);font-size:13px;line-height:1.45;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#batBox{position:absolute;bottom:20px;left:20px;background:rgba(15,23,42,.88);backdrop-filter:blur(10px);color:#fff;padding:16px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.25);border-left:6px solid #ef4444;min-width:230px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#gtDial{position:absolute;bottom:20px;right:20px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(30,41,59,.92) 55%,rgba(15,23,42,.98) 100%);border:4px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10}
#cb{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 24px;border-radius:22px;font-size:15px;font-weight:bold;display:none;border:2px solid #fff;z-index:10}
</style>
<script src="https://jsdelivr.net"></script>
</head>
<body>
<div id="cb">⚡ RECHARGE TOTALENERGIES 300 kW</div>
<div id="u"><b style="color:#60a5fa">AUDI A2 e-tron • AUTOROUTE A1 / A25 (326 ch)</b><br><b>Flèches / ZQSD</b> : Conduire | <b>Bas / S</b> : Frein & Recul<br><b>M</b> : Mode | <b>N</b> : Nuit/Jour | <b>H</b> : Klaxon | <b>R</b> : Reset km | <b>V</b> : Bat 10%</div>
<div id="batBox">
  <div id="md" style="font-size:13px;font-weight:bold;color:#ef4444;letter-spacing:.5px">DYNAMIC • 326 ch</div>
  <div style="font-size:22px;font-weight:bold;margin:4px 0">🔋 <span id="b">85%</span> <span style="font-size:15px;color:#cbd5e1;font-weight:normal">(<span id="rng">382</span> km)</span></div>
  <div style="width:100%;height:7px;background:#334155;border-radius:4px;overflow:hidden;margin:6px 0"><div id="bBar" style="width:85%;height:100%;background:#4ade80"></div></div>
  <div style="font-size:14px;color:#e2e8f0">🛣️ Distance : <b id="o">0.0</b> km</div>
</div>
<div id="gtDial">
  <div id="g" style="background:#dc2626;padding:2px 10px;border-radius:6px;font-weight:bold;font-size:15px;margin-bottom:2px">D</div>
  <div id="s" style="font-size:44px;font-weight:900;line-height:1">0</div>
  <div style="font-size:12px;color:#94a3b8;letter-spacing:1px">KM/H</div>
  <div style="font-size:11px;color:#60a5fa;margin-top:4px"><span id="p">0</span> ch</div>
</div>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x38bdf8);scene.fog=new THREE.FogExp2(0xbae6fd,0.0018);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,950);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)};
const hemi=new THREE.HemisphereLight(0xffffff,0x3f6212,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfffbeb,1.3);sun.position.set(-40,90,-120);scene.add(sun);
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(28,32),new THREE.MeshBasicMaterial({color:0xffffff}));sunDisc.position.set(-140,180,-650);scene.add(sunDisc);
function makeSkyTex(){
  const cv=document.createElement('canvas');cv.width=1024;cv.height=512;const ctx=cv.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,512);g.addColorStop(0,'#0284c7');g.addColorStop(.65,'#38bdf8');g.addColorStop(1,'#e0f2fe');ctx.fillStyle=g;ctx.fillRect(0,0,1024,512);
  ctx.fillStyle='rgba(255,255,255,0.85)';for(let i=0;i<35;i++){ctx.beginPath();ctx.arc((i*173)%1024,120+(i*47)%240,35+(i%4)*18,0,Math.PI*2);ctx.fill()}
  return new THREE.CanvasTexture(cv);
}
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(750,24,16),new THREE.MeshBasicMaterial({map:makeSkyTex(),side:THREE.BackSide,fog:false}));scene.add(skyDome);
function makeRoadTex(){
  const cv=document.createElement('canvas');cv.width=1024;cv.height=1024;const ctx=cv.getContext('2d');
  ctx.fillStyle='#4b5563';ctx.fillRect(0,0,1024,1024);
  for(let i=0;i<22000;i++){ctx.fillStyle=Math.random()>.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';ctx.fillRect(Math.random()*1024,Math.random()*1024,2,2)}
  ctx.fillStyle='#f8fafc';ctx.fillRect(36,0,14,1024);ctx.fillRect(974,0,14,1024);
  ctx.fillStyle='#facc15';ctx.fillRect(496,0,10,1024);ctx.fillRect(518,0,10,1024);
  ctx.fillStyle='#f8fafc';const ln=new Array(260,754);ln.forEach(lx=>{for(let y=0;y<1024;y+=128)ctx.fillRect(lx,y,10,64)});
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,160);return t;
}
const roadMat=new THREE.MeshStandardMaterial({map:makeRoadTex(),roughness:0.8});
const road=new THREE.Mesh(new THREE.PlaneGeometry(32,4000),roadMat);road.rotation.x=-Math.PI/2;scene.add(road);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(2400,4000),new THREE.MeshStandardMaterial({color:0x4d7c0f,roughness:0.9}));grass.rotation.x=-Math.PI/2;grass.position.y=-0.05;scene.add(grass);
const railMat=new THREE.MeshStandardMaterial({color:0xe2e8f0,metalness:0.7,roughness:0.3});
new Array(-16.4,16.4).forEach(rx=>{const r=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.45,4000),railMat);r.position.set(rx,0.65,0);scene.add(r)});
const envObjs=new Array();
const solarMat=new THREE.MeshStandardMaterial({color:0x1e3a8a,metalness:0.8,roughness:0.2});
for(let z=-60;z>-3800;z-=55){
  if(z<-1900&&z>-2500)continue;
  const sp=new THREE.Mesh(new THREE.BoxGeometry(14,0.2,9),solarMat);sp.position.set(27,2.4,z);sp.rotation.z=0.45;scene.add(sp);envObjs.push(sp);
  const tree=new THREE.Group();
  const trk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.45,3.5,8),new THREE.MeshStandardMaterial({color:0x451a03}));trk.position.y=1.75;tree.add(trk);
  const fol=new THREE.Mesh(new THREE.ConeGeometry(2.8,7.5,8),new THREE.MeshStandardMaterial({color:0x166534}));fol.position.y=6.2;tree.add(fol);
  tree.position.set(-24-(Math.abs(z)%25),0,z);scene.add(tree);envObjs.push(tree);
  if(Math.abs(z)%220<55){
    const hse=new THREE.Group();
    const wl=new THREE.Mesh(new THREE.BoxGeometry(11,4.5,14),new THREE.MeshStandardMaterial({color:0xb91c1c}));wl.position.y=2.25;hse.add(wl);
    const rf=new THREE.Mesh(new THREE.ConeGeometry(9.5,3.2,4),new THREE.MeshStandardMaterial({color:0x1e293b}));rf.position.y=6.0;rf.rotation.y=Math.PI/4;hse.add(rf);
    hse.position.set(-34,0,z-20);scene.add(hse);envObjs.push(hse);
  }
}
function makeSignTex(l1,l2,l3,sub){
  const cv=document.createElement('canvas');cv.width=512;cv.height=256;const ctx=cv.getContext('2d');
  ctx.fillStyle='#1d4ed8';ctx.fillRect(0,0,512,256);ctx.strokeStyle='#fff';ctx.lineWidth=10;ctx.strokeRect(8,8,496,240);
  ctx.fillStyle='#dc2626';ctx.fillRect(156,14,200,34);ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText(sub,256,39);
  ctx.font='bold 42px Arial';ctx.fillText(l1,256,102);ctx.fillText(l2,256,158);
  ctx.fillStyle='#fde047';ctx.font='bold 30px Arial';ctx.fillText(l3,256,214);return new THREE.CanvasTexture(cv);
}
function addGantry(z,t1,t2,t3,sub){
  const g=new THREE.Group();
  new Array(-16.2,16.2).forEach(px=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.38,9.5,12),railMat);p.position.set(px,4.75,0);g.add(p)});
  const bar=new THREE.Mesh(new THREE.BoxGeometry(33,0.45,0.45),railMat);bar.position.set(0,8.4,0);g.add(bar);
  const brd=new THREE.Mesh(new THREE.BoxGeometry(11.5,5.4,0.25),new THREE.MeshStandardMaterial({map:makeSignTex(t1,t2,t3,sub)}));brd.position.set(7.2,7.8,0.2);g.add(brd);
  g.position.z=z;scene.add(g);envObjs.push(g);
}
addGantry(-320,"Lille • Paris","Arras • Lens","⬇   ⬇   ⬇","A 1 / A 25");
addGantry(-1900,"AIRE DE REPOS","⚡ BORNES 300 kW","SORTIE ↗ 300 m","TOTALENERGIES");

const stGrp=new THREE.Group();
const pad=new THREE.Mesh(new THREE.PlaneGeometry(28,150),new THREE.MeshStandardMaterial({color:0x334155}));pad.rotation.x=-Math.PI/2;pad.position.set(29,0.02,0);stGrp.add(pad);
const shop=new THREE.Mesh(new THREE.BoxGeometry(10,4.8,24),new THREE.MeshStandardMaterial({color:0xf8fafc}));shop.position.set(37,2.4,-12);stGrp.add(shop);
const shopGlass=new THREE.Mesh(new THREE.BoxGeometry(0.2,3.2,18),new THREE.MeshStandardMaterial({color:0x0f172a,metalness:0.8,roughness:0.1}));shopGlass.position.set(31.95,1.8,-12);stGrp.add(shopGlass);
const shopBand=new THREE.Mesh(new THREE.BoxGeometry(10.3,0.7,24.3),new THREE.MeshStandardMaterial({color:0xdc2626}));shopBand.position.set(37,4.6,-12);stGrp.add(shopBand);
const canopy=new THREE.Mesh(new THREE.BoxGeometry(12,0.7,14),new THREE.MeshStandardMaterial({color:0xf8fafc}));canopy.position.set(22,5.2,14);stGrp.add(canopy);
const stripe=new THREE.Mesh(new THREE.BoxGeometry(12.2,0.35,14.2),new THREE.MeshStandardMaterial({color:0xdc2626}));stripe.position.set(22,4.85,14);stGrp.add(stripe);
new Array(17,27).forEach(bx=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.45,4.8,0.45),railMat);p.position.set(bx,2.4,14);stGrp.add(p)});
new Array(10,14,18).forEach(cz=>{
  const ch=new THREE.Mesh(new THREE.BoxGeometry(0.9,2.3,0.7),new THREE.MeshStandardMaterial({color:0xffffff}));ch.position.set(22,1.15,cz);stGrp.add(ch);
  const scr=new THREE.Mesh(new THREE.BoxGeometry(0.94,0.45,0.4),new THREE.MeshBasicMaterial({color:0x38bdf8}));scr.position.set(22,1.65,cz);stGrp.add(scr);
});
new Array(-28,-16,-4).forEach(tz=>{
  const tbl=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.12,2.2),new THREE.MeshStandardMaterial({color:0x78350f}));tbl.position.set(29,0.85,tz);stGrp.add(tbl);
  new Array(-0.95,0.95).forEach(bn=>{const b=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.1,2.2),new THREE.MeshStandardMaterial({color:0x92400e}));b.position.set(29+bn,0.48,tz);stGrp.add(b)});
  const bin=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.28,0.95,12),new THREE.MeshStandardMaterial({color:0x15803d}));bin.position.set(30.8,0.48,tz+1.4);stGrp.add(bin);
});
new Array(-48,-35).forEach(pz=>{
  const pk=new THREE.Group();
  const trl=new THREE.Mesh(new THREE.BoxGeometry(2.55,3.3,11.5),new THREE.MeshStandardMaterial({color:0xf8fafc}));trl.position.set(0,2.15,0);pk.add(trl);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(2.5,3.0,2.4),new THREE.MeshStandardMaterial({color:0x1e293b}));cab.position.set(0,1.95,-6.9);pk.add(cab);
  pk.position.set(25,0,pz);stGrp.add(pk);
});
stGrp.position.z=-2200;scene.add(stGrp);envObjs.push(stGrp);
const audi=new THREE.Group();
const bodyMat=new THREE.MeshPhysicalMaterial({color:0x1d4ed8,metalness:0.75,roughness:0.2,clearcoat:1.0});
const glassMat=new THREE.MeshStandardMaterial({color:0x090d16,metalness:0.9,roughness:0.1});
const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.05,0.72,4.25),bodyMat);chassis.position.y=0.62;audi.add(chassis);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.78,0.58,2.35),bodyMat);cabin.position.set(0,1.22,-0.15);audi.add(cabin);
const rearWin=new THREE.Mesh(new THREE.PlaneGeometry(1.56,0.46),glassMat);rearWin.position.set(0,1.22,1.04);rearWin.rotation.x=-0.35;audi.add(rearWin);
const oledMat=new THREE.MeshBasicMaterial({color:0xdc2626});
const lightBar=new THREE.Mesh(new THREE.BoxGeometry(1.94,0.09,0.08),oledMat);lightBar.position.set(0,0.86,2.13);audi.add(lightBar);
const plate=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.2,0.05),new THREE.MeshBasicMaterial({color:0xf8fafc}));plate.position.set(0,0.52,2.13);audi.add(plate);
const wheels=new Array();
new Array(-0.96,0.96).forEach(wx=>{new Array(1.32,-1.32).forEach(wz=>{
  const w=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.26,20),new THREE.MeshStandardMaterial({color:0x09090b}));
  w.rotation.z=Math.PI/2;w.position.set(wx,0.36,wz);audi.add(w);wheels.push(w);
})});
audi.position.set(8.2,0,0);scene.add(audi);

const traffic=new Array();
function spawnVehicle(isTruck,laneX,zPos,speedKmh,colHex){
  const g=new THREE.Group();
  if(isTruck){
    const trl=new THREE.Mesh(new THREE.BoxGeometry(2.55,3.3,11.5),new THREE.MeshStandardMaterial({color:colHex}));trl.position.set(0,2.15,0);g.add(trl);
    const cab=new THREE.Mesh(new THREE.BoxGeometry(2.5,3.0,2.4),new THREE.MeshStandardMaterial({color:0xe2e8f0}));cab.position.set(0,1.95,-6.9);g.add(cab);
    const tl=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.18,0.1),new THREE.MeshBasicMaterial({color:0xef4444}));tl.position.set(0,0.85,5.76);g.add(tl);
  }else{
    const b=new THREE.Mesh(new THREE.BoxGeometry(1.95,0.68,4.3),new THREE.MeshStandardMaterial({color:colHex,metalness:0.6,roughness:0.25}));b.position.y=0.58;g.add(b);
    const c=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.52,2.2),glassMat);c.position.set(0,1.14,-0.1);g.add(c);
    const tl=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.1,0.08),new THREE.MeshBasicMaterial({color:speedKmh<0?0xfef08a:0xef4444}));tl.position.set(0,0.78,speedKmh<0?-2.16:2.16);g.add(tl);
  }
  g.position.set(laneX,0,zPos);scene.add(g);traffic.push({mesh:g,sp:speedKmh/3.6});
}
spawnVehicle(true,11.8,-65,82,0xf8fafc);
spawnVehicle(false,4.2,-120,115,0x1e293b);
spawnVehicle(false,8.2,-195,125,0xb91c1c);
spawnVehicle(true,11.8,-310,80,0xe2e8f0);
spawnVehicle(false,-4.5,-150,-110,0xf1f5f9);
spawnVehicle(true,-11.8,-260,-85,0xffffff);

const modes=new Array({n:"EFFICIENCY • 200 ch",max:150,hp:200,acc:22,cn:0.85,c:"#4ade80"},{n:"COMFORT • 260 ch",max:180,hp:260,acc:30,cn:1.0,c:"#60a5fa"},{n:"DYNAMIC • 326 ch",max:210,hp:326,acc:42,cn:1.15,c:"#ef4444"});
let mi=2,spd=0,bat=85,dst=0,ngt=0,hn=0,ac=null,last=performance.now();
const k={};
function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
onkeydown=e=>{const v=e.key.toLowerCase();k[v]=1;if(v=='arrowup'||v=='arrowdown'||v=='arrowleft'||v=='arrowright'||v==' ')e.preventDefault();if(v=='v')bat=10;if(v=='r')dst=0;if(v=='h'||v=='k')horn();if(v=='n'){ngt=1-ngt;skyDome.visible=!ngt;sunDisc.visible=!ngt;scene.background.setHex(ngt?0x020617:0x38bdf8);scene.fog.color.setHex(ngt?0x020617:0xbae6fd);hemi.intensity=ngt?0.25:1.1;sun.intensity=ngt?0.15:1.3}if(v=='m'){mi=(mi+1)%3;const m=modes[mi],el=document.getElementById('md');el.innerText=m.n;el.style.color=m.c;document.getElementById('batBox').style.borderLeftColor=m.c}};
onkeyup=e=>{const v=e.key.toLowerCase();k[v]=0;if(v=='h'||v=='k')hn=0};

function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d,m=modes[mi],maxS=bat>0?m.max:35;let hp=0;
  if(brk){spd*=0.88;if(Math.abs(spd)<0.5)spd=0}else if(acc&&bat>0){spd=Math.min(maxS,spd+m.acc*dt);hp=Math.min(m.hp,Math.round(m.hp*0.4+(spd/m.max)*m.hp*0.6))}else if(rev&&bat>0){if(spd>1){spd-=65*dt;hp=-120}else{spd=Math.max(-35,spd-20*dt);hp=85}}else{spd-=14*dt*(spd>0?1:-1);if(Math.abs(spd)<0.4)spd=0;if(spd>5)hp=-25}
  oledMat.color.setHex((brk||rev)?0xff2a44:0xdc2626);
  const ms=spd/3.6,stepKm=(Math.abs(spd)*dt)/3600;dst+=stepKm;
  roadMat.map.offset.y-=ms*dt*0.04;
  envObjs.forEach(o=>{o.position.z+=ms*dt;if(o.position.z>90)o.position.z-=3800});
  const st=(lft?-1:0)+(rgt?1:0);
  const nearStation=stGrp.position.z>-85&&stGrp.position.z<85;
  const maxX=nearStation?27.5:14.8;
  if(Math.abs(spd)>0.5)audi.position.x+=st*11*dt*(spd>=0?1:-1);
  audi.position.x=Math.max(1.8,Math.min(maxX,audi.position.x));
  audi.rotation.z=-st*0.045;audi.rotation.y=-st*0.06;
  wheels.forEach(w=>w.rotation.x-=ms*dt*2.8);
  traffic.forEach(t=>{t.mesh.position.z+=(ms-t.sp)*dt;if(t.mesh.position.z>45)t.mesh.position.z=-480;if(t.mesh.position.z<-520)t.mesh.position.z=35});
  const chg=nearStation&&audi.position.x>18.5&&Math.abs(spd)<30;
  const cb=document.getElementById('cb');
  if(chg){bat=Math.min(100,bat+(bat>80?2.2:4.5)*dt);cb.style.display="block";cb.innerText="⚡ RECHARGE TOTALENERGIES : "+Math.ceil(bat)+"%"}else{cb.style.display="none";if(acc&&bat>0)bat=Math.max(0,bat-(stepKm/4.5)*m.cn);else if(spd>5)bat=Math.min(100,bat+(stepKm/4.5)*(rev?0.4:0.15))}
  cam.position.set(audi.position.x*0.94,2.55+(spd/210)*0.2,5.6+(spd/210)*0.7);
  cam.lookAt(audi.position.x,1.05,-18);
  const g=document.getElementById('g');g.innerText=spd<-0.5?"R":"D";g.style.background=spd<-0.5?"#f59e0b":"#dc2626";
  document.getElementById('s').innerText=Math.abs(Math.round(spd));document.getElementById('p').innerText=hp;
  const bPct=Math.ceil(bat);document.getElementById('b').innerText=bPct+"%";document.getElementById('rng').innerText=Math.round(bat*4.5);document.getElementById('o').innerText=dst.toFixed(1);
  const bBar=document.getElementById('bBar');bBar.style.width=bPct+"%";bBar.style.background=chg?"#38bdf8":(bPct<20?"#ef4444":(bPct<50?"#f59e0b":"#4ade80"));
  ren.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
