<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Audi A2 e-tron - Simulateur</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1e242b; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            background: rgba(15, 20, 30, 0.85); padding: 15px; border-radius: 10px;
            border-left: 4px solid #16389c; user-select: none;
        }
        h1 { margin: 0 0 8px 0; font-size: 18px; }
        p { margin: 4px 0; font-size: 13px; color: #ddd; }
        .controls { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        #speedometer {
            position: absolute; bottom: 15px; right: 15px; color: white;
            background: rgba(15, 20, 30, 0.85); padding: 12px 20px; border-radius: 10px;
            font-size: 26px; font-weight: bold; border-bottom: 4px solid #16389c; user-select: none;
        }
        span.unit { font-size: 14px; color: #5c85ff; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>AUDI A2 e-tron</h1>
        <p><strong>Flèches</strong> ou <strong>Z Q S D</strong> : Conduire</p>
        <p><strong>Espace</strong> : Freiner</p>
        <div class="controls">
            <label for="carColor">Peinture :</label>
            <input type="color" id="carColor" value="#16389c">
        </div>
    </div>
    <div id="speedometer">0 <span class="unit">km/h</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let carColor = "#16389c";
        document.getElementById('carColor').addEventListener('input', (e) => {
            carColor = e.target.value;
        });

        // État de la voiture
        const car = {
            x: 0,
            y: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 14,
            accel: 0.25,
            friction: 0.97,
            turnSpeed: 0.045
        };

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, z: false, s: false, q: false, d: false, " ": false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = true;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = false;
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Génération de repères sur la carte (arbres, plots)
        const props = [];
        for (let i = 0; i < 150; i++) {
            let px = (Math.random() - 0.5) * 3000;
            if (Math.abs(px) < 180) px += (px > 0 ? 220 : -220); // Hors de la route
            props.push({
                x: px,
                y: (Math.random() - 0.5) * 6000,
                size: 18 + Math.random() * 20,
                type: Math.random() > 0.3 ? 'tree' : 'rock'
            });
        }

        function drawAudiA2Etron() {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(car.angle);

            // Ombre sous la voiture
            ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
            ctx.beginPath();
            ctx.roundRect(-24, -46, 48, 92, 12);
            ctx.fill();

            // Roues avant qui braquent
            const steer = (keys.ArrowLeft || keys.q) ? -0.35 : ((keys.ArrowRight || keys.d) ? 0.35 : 0);
            ctx.fillStyle = "#111";
            // Avant gauche
            ctx.save(); ctx.translate(-21, -26); ctx.rotate(steer);
            ctx.fillRect(-4, -9, 8, 18); ctx.restore();
            // Avant droit
            ctx.save(); ctx.translate(21, -26); ctx.rotate(steer);
            ctx.fillRect(-4, -9, 8, 18); ctx.restore();
            // Arrière
            ctx.fillRect(-25, 18, 8, 18);
            ctx.fillRect(17, 18, 8, 18);

            // Carrosserie principale (Bleu configuration)
            ctx.fillStyle = carColor;
            ctx.beginPath();
            ctx.roundRect(-21, -44, 42, 88, 10);
            ctx.fill();

            // Reflet métallisé sur le capot
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            ctx.beginPath();
            ctx.roundRect(-16, -40, 32, 22, 6);
            ctx.fill();

            // Rétroviseurs noirs (Pack noir)
            ctx.fillStyle = "#141414";
            ctx.fillRect(-26, -15, 6, 8);
            ctx.fillRect(20, -15, 6, 8);

            // Pare-brise et vitres teintées
            ctx.fillStyle = "#12161f";
            ctx.beginPath();
            ctx.roundRect(-17, -18, 34, 48, 6);
            ctx.fill();

            // Toit couleur carrosserie
            ctx.fillStyle = carColor;
            ctx.beginPath();
            ctx.roundRect(-15, -6, 30, 28, 4);
            ctx.fill();

            // Calandre avant noire & 4 anneaux
            ctx.fillStyle = "#111";
            ctx.fillRect(-13, -45, 26, 3);
            ctx.fillStyle = "#fff";
            ctx.fillRect(-6, -45, 12, 1.5);

            // Phares LED segmentés (traits blancs)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-19, -44, 4, 2);
            ctx.fillRect(-14, -44, 3, 2);
            ctx.fillRect(11, -44, 3, 2);
            ctx.fillRect(15, -44, 4, 2);

            // Faisceaux des phares sur la route
            const grad = ctx.createLinearGradient(0, -44, 0, -180);
            grad.addColorStop(0, "rgba(255, 255, 240, 0.35)");
            grad.addColorStop(1, "rgba(255, 255, 240, 0)");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-18, -44); ctx.lineTo(-45, -180); ctx.lineTo(45, -180); ctx.lineTo(18, -44);
            ctx.fill();

            // Bandeau LED rouge arrière
            ctx.fillStyle = "#ff0022";
            ctx.fillRect(-18, 42, 36, 3);

            ctx.restore();
        }

        function update() {
            if (keys.ArrowUp || keys.z) car.speed += car.accel;
            if (keys.ArrowDown || keys.s) car.speed -= car.accel;
            if (keys[" "]) car.speed *= 0.88;

            car.speed *= car.friction;
            if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
            if (car.speed < -car.maxSpeed / 2) car.speed = -car.maxSpeed / 2;

            if (Math.abs(car.speed) > 0.1) {
                const dir = car.speed > 0 ? 1 : -1;
                if (keys.ArrowLeft || keys.q) car.angle -= car.turnSpeed * dir;
                if (keys.ArrowRight || keys.d) car.angle += car.turnSpeed * dir;
            }

            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;

            document.getElementById('speedometer').innerHTML = `${Math.abs(Math.round(car.speed * 13))} <span class="unit">km/h</span>`;
        }

        function draw() {
            // Fond paysage (herbe / sable côtier comme sur votre photo)
            ctx.fillStyle = "#c2b8a3";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Caméra centrée sur la voiture
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

            // Mer sur la droite (comme sur la photo)
            ctx.fillStyle = "#4a7c9b";
            ctx.fillRect(600, -10000, 5000, 20000);

            // Route asphaltée
            ctx.fillStyle = "#2b2e33";
            ctx.fillRect(-140, -10000, 280, 20000);

            // Bordures blanches de la route
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-132, -10000, 5, 20000);
            ctx.fillRect(127, -10000, 5, 20000);

            // Lignes pointillées centrales
            const startY = Math.floor((car.y - canvas.height) / 100) * 100;
            const endY = startY + canvas.height * 2;
            for (let y = startY; y < endY; y += 100) {
                ctx.fillRect(-3, y, 6, 45);
            }

            // Décor (Arbres et rochers)
            props.forEach(p => {
                // Boucle infinie du décor autour du joueur
                let dy = ((p.y - car.y + 3000) % 6000) - 3000 + car.y;
                if (p.type === 'tree') {
                    ctx.fillStyle = "rgba(0,0,0,0.2)";
                    ctx.beginPath(); ctx.arc(p.x + 6, dy + 6, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#3a5a40";
                    ctx.beginPath(); ctx.arc(p.x, dy, p.size, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = "#8a817c";
                    ctx.beginPath(); ctx.arc(p.x, dy, p.size * 0.7, 0, Math.PI * 2); ctx.fill();
                }
            });

            ctx.restore();

            // Dessiner l'Audi A2 e-tron au centre
            drawAudiA2Etron();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
