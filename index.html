<!DOCTYPE html>

</head>
<body>
<div id="cb">⚡ RECHARGE TOTALENERGIES 300 kW</div>
<div id="u"><b style="color:#60a5fa">AUDI A2 e-tron • AUTOROUTE A1 / A25 (326 ch)</b><br><b>Flèches / ZQSD</b> : Conduire | <b>Bas / S</b> : Frein & Recul<br><b>M</b> : Mode (+Bat Eco) | <b>N</b> : Nuit/Jour | <b>H</b> : Klaxon | <b>V</b> : Bat 10%</div>

</div>

<canvas id="c" width="1280" height="720"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=1280,H=720,ac=null,hn=0,mi=2,pos=0,px=0.28,spd=0,bat=85,dst=0,ngt=0,last=performance.now();
function fit(){W=c.width=innerWidth||1280;H=c.height=innerHeight||720}onresize=fit;fit();
function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
const segs=new Array(),L=200,R=2200,N=2400,TL=N*L;
for(let i=0;i<N;i++){let rm=0,sg=0,ch=0,trA=0,gt=0;if(i==80||i==1280)gt=1;if(i==650||i==1850)gt=2;if(i==960)sg=1;if(i>=985&&i<1020)rm=(i-985)/35;if(i>=1020&&i<=1180)rm=1;if(i>1180&&i<=1215)rm=1-(i-1180)/35;if(i==1100)ch=1;if(i%3==0)trA=1;let cv=0;if(i>240&&i<380)cv=.75;if(i>740&&i<880)cv=-.85;if(i>1450&&i<1620)cv=.75;segs.push({i,cv,dk:Math.floor(i/3)%2==0,rm,sg,ch,trA,gt})}
const tr=new Array(
  {tk:1,z:950,ln:.68,sp:4200,cl:"#f8fafc"},
  {tk:0,z:1900,ln:.24,sp:6800,cl:"#1e293b"},
  {tk:1,z:3100,ln:.68,sp:4400,cl:"#e2e8f0"},
  {tk:0,z:4600,ln:.24,sp:7400,cl:"#b91c1c"},
  {tk:1,z:6200,ln:.68,sp:4100,cl:"#ffffff"},
  {tk:1,z:2400,ln:-.68,sp:-4800,cl:"#f1f5f9"},
  {tk:0,z:4200,ln:-.25,sp:-6200,cl:"#334155"}

const modes=new Array(
  {n:"EFFICIENCY • 200 ch (ECO+)",ms:9000,hp:200,ac:5400,cn:.52,maxKm:560,c:"#4ade80"},
  {n:"COMFORT • 260 ch",ms:10800,hp:260,ac:6800,cn:.95,maxKm:480,c:"#60a5fa"},
  {n:"DYNAMIC • 326 ch",ms:12600,hp:326,ac:8500,cn:1.15,maxKm:450,c:"#ef4444"}

const k={};
onkeydown=e=>{let v=e.key.toLowerCase();k[v]=1;if(v=='arrowup'||v=='arrowdown'||v=='arrowleft'||v=='arrowright'||v==' ')e.preventDefault();if(v=='v')bat=10;if(v=='n')ngt=1-ngt;if(v=='h'||v=='k')horn();if(v=='r')dst=0;if(v=='m'){mi=(mi+1)%3;let m=modes[mi],el=document.getElementById('md');if(mi==0)bat=Math.min(100,bat+15);el.innerText=m.n;el.style.color=m.c;document.getElementById('batBox').style.borderLeftColor=m.c}};
onkeyup=e=>{let v=e.key.toLowerCase();k[v]=0;if(v=='h'||v=='k')hn=0};
function drawGantry(x1,y1,w1,sc1,tp){
  const gs=sc1*22e4;if(gs<8||gs>900)return;const h=gs*2.15,pg=x.createLinearGradient(0,y1-h,0,y1);pg.addColorStop(0,"#cbd5e1");pg.addColorStop(1,"#475569");

    x.fillText(lb.at(4),rx,by+gs*.24);x.fillText(lb.at(5),rx,by+gs*.38);x.fillText("↗",rx+rw*.26,by+gs*.47);

function drawRestSign(x1,y1,w1,sc1){
  const ss=sc1*26e4;if(ss<6||ss>850)return;const sx=x1+w1*1.48,pw=ss*1.55,ph=ss*.68,py=y1-ss*1.65;

  x.fillStyle="#cbd5e1";x.fillRect(cx+cs*.75,y1-cs*1.35,cs*1.5,cs*1.35);

  x.fillStyle="#78350f";x.fillRect(cx+cs*.15,y1-cs*.28,cs*.45,cs*.08);x.fillRect(cx+cs*.22,y1-cs*.2,cs*.08,cs*.2);x.fillRect(cx+cs*.46,y1-cs*.2,cs*.08,cs*.2);
  x.fillStyle="#15803d";x.fillRect(cx+cs*.64,y1-cs*.32,cs*.12,cs*.32);
  x.fillStyle="#f8fafc";x.fillRect(cx-cs*1.55,y1-cs*1.2,cs*.65,cs*1.05);x.fillStyle="#1e293b";x.fillRect(cx-cs*1.5,y1-cs*.25,cs*.55,cs*.25);
  x.fillStyle="#f8fafc";x.fillRect(cx-cs*.82,y1-cs*1.12,cs*1.5,cs*.2);x.fillStyle="#ef4444";x.fillRect(cx-cs*.82,y1-cs*.96,cs*1.5,cs*.07);x.fillStyle="#2563eb";x.fillRect(cx-cs*.82,y1-cs*.89,cs*1.5,cs*.04);
  new Array(-.55,.45).forEach(p=>{x.fillStyle="#334155";x.fillRect(cx+cs*p-cs*.05,y1-cs*.85,cs*.1,cs*.85)});
  new Array(-.28,.18).forEach(b=>{x.fillStyle="#f8fafc";x.fillRect(cx+cs*b-cs*.09,y1-cs*.58,cs*.18,cs*.58);x.fillStyle="#0f172a";x.fillRect(cx+cs*b-cs*.06,y1-cs*.52,cs*.12,cs*.16);x.fillStyle="#38bdf8";x.fillRect(cx+cs*b-cs*.04,y1-cs*.5,cs*.08,cs*.08)});
  if(cs>24){x.fillStyle="#0f172a";x.font="bold "+Math.round(cs*.09)+"px Arial";x.textAlign="center";x.fillText("TotalEnergies • 300 kW",cx-cs*.05,y1-cs*1.01);x.fillStyle="#fff";x.fillText("BOUTIQUE",cx+cs*1.5,y1-cs*1.34)}
}
function drawScenery(x1,y1,w1,sc1,idx){
  const ss=sc1*19e4;if(ss<5||ss>650)return;
  if(idx%24===0){
    const hx=x1-w1*2.15;x.fillStyle="#b91c1c";x.fillRect(hx-ss*.85,y1-ss*.75,ss*1.15,ss*.75);
    x.fillStyle="#1e293b";x.beginPath();x.moveTo(hx-ss*.95,y1-ss*.75);x.lineTo(hx-ss*.28,y1-ss*1.25);x.lineTo(hx+ss*.4,y1-ss*.75);x.fill();
    x.fillStyle="#f8fafc";x.fillRect(hx-ss*.6,y1-ss*.55,ss*.24,ss*.24);x.fillRect(hx-ss*.2,y1-ss*.55,ss*.24,ss*.24);
  }
  const txL=x1-w1*1.45;x.fillStyle="#451a03";x.fillRect(txL-ss*.06,y1-ss*.42,ss*.12,ss*.42);
  x.fillStyle=ngt?"#064e3b":"#15803d";x.beginPath();x.moveTo(txL-ss*.46,y1-ss*.35);x.lineTo(txL,y1-ss*1.38);x.lineTo(txL+ss*.46,y1-ss*.35);x.fill();
  const txR=x1+w1*1.55;x.fillStyle="#451a03";x.fillRect(txR-ss*.06,y1-ss*.48,ss*.12,ss*.48);
  const fg=x.createRadialGradient(txR-ss*.1,y1-ss*.85,ss*.04,txR,y1-ss*.72,ss*.45);fg.addColorStop(0,ngt?"#065f46":"#65a30d");fg.addColorStop(1,ngt?"#022c22":"#365314");
  x.fillStyle=fg;x.beginPath();x.arc(txR,y1-ss*.76,ss*.4,0,Math.PI*2);x.arc(txR-ss*.24,y1-ss*.62,ss*.26,0,Math.PI*2);x.arc(txR+ss*.24,y1-ss*.62,ss*.26,0,Math.PI*2);x.fill();
}
function drawCarDirect(v){
  if(v.z<220||v.z>14000)return;
  const sc=.84/v.z,vy=H/2+sc*1e3*H/2,vw=sc*R*W/2,vx=W/2-sc*(px*R)*W/2+v.ln*vw,w=sc*(v.tk?2350:1600),h=sc*(v.tk?3400:1180);
  if(w<5||vy>H+140)return;x.save();x.translate(vx,vy);
  x.fillStyle="rgba(0,0,0,.7)";x.beginPath();x.ellipse(0,5,w*.64,h*.11,0,0,Math.PI*2);x.fill();
  x.fillStyle="#09090b";x.fillRect(-w*.46,-h*.22,w*.17,h*.22);x.fillRect(w*.29,-h*.22,w*.17,h*.22);
  const g=x.createLinearGradient(0,-h,0,0);g.addColorStop(0,v.cl);g.addColorStop(.5,"#cbd5e1");g.addColorStop(1,"#334155");x.fillStyle=g;x.fillRect(-w*.48,-h,w*.96,h*.86);
  if(v.tk){
    if(v.sp<0){x.fillStyle="#0f172a";x.fillRect(-w*.42,-h*.75,w*.84,h*.24);x.fillStyle="#090d16";x.fillRect(-w*.36,-h*.42,w*.72,h*.22);x.fillStyle="#fef08a";x.fillRect(-w*.45,-h*.28,w*.18,h*.08);x.fillRect(w*.27,-h*.28,w*.18,h*.08)}
    else{x.strokeStyle="#64748b";x.lineWidth=1.8;x.strokeRect(-w*.42,-h*.94,w*.4,h*.74);x.strokeRect(w*.02,-h*.94,w*.4,h*.74);x.fillStyle="#1e293b";x.fillRect(-w*.48,-h*.18,w*.96,h*.08);x.fillStyle="#ef4444";x.fillRect(-w*.45,-h*.16,w*.2,h*.05);x.fillRect(w*.25,-h*.16,w*.2,h*.05)}
    if(w>16){x.strokeStyle="#0f172a";x.lineWidth=2;x.beginPath();x.arc(0,-h*.56,w*.12,0,Math.PI*2);x.stroke();x.fillStyle="#0f172a";x.font="bold "+Math.round(w*.095)+"px Arial";x.textAlign="center";x.fillText("MERCEDES",0,-h*.82)}
  }else{x.fillStyle="#020617";x.fillRect(-w*.36,-h*.9,w*.72,h*.36);x.fillStyle=v.sp<0?"#fef08a":"#ff1e1e";x.fillRect(-w*.44,-h*.48,w*.88,h*.07)}
  x.restore();
}
function drawAudi(st,brk,rev,chg){
  x.save();x.translate(W/2+st*55,H-16);x.rotate(st*.045);
  if(ngt||hn){const bm=x.createLinearGradient(0,-170,0,-430);bm.addColorStop(0,hn?"rgba(255,255,255,.72)":"rgba(224,242,254,.45)");bm.addColorStop(1,"rgba(224,242,254,0)");x.fillStyle=bm;x.beginPath();x.moveTo(-105,-170);x.lineTo(-270,-430);x.lineTo(270,-430);x.lineTo(105,-170);x.fill()}
  x.fillStyle="rgba(0,0,0,.9)";x.beginPath();x.ellipse(0,12,188,30,0,0,Math.PI*2);x.fill();
  new Array(-152,110).forEach(wx=>{x.fillStyle="#09090b";x.fillRect(wx,-66,42,72);for(let t=wx+6;t<wx+38;t+=6){x.fillStyle="#18181b";x.fillRect(t,-64,3,68)}});
  x.fillStyle="#090d16";x.beginPath();x.moveTo(-4,-196);x.lineTo(0,-212);x.lineTo(6,-196);x.fill();
  new Array(-146,122).forEach(mx=>{x.fillStyle="#090d16";x.fillRect(mx,-140,24,13);x.fillStyle="#2563eb";x.fillRect(mx+2,-142,20,8)});
  const bg=x.createLinearGradient(0,-200,0,-22);bg.addColorStop(0,"#93c5fd");bg.addColorStop(.14,"#3b82f6");bg.addColorStop(.38,"#1d4ed8");bg.addColorStop(.68,"#1e3a8a");bg.addColorStop(.9,"#0f172a");bg.addColorStop(1,"#020617");
  x.fillStyle=bg;x.beginPath();x.moveTo(-152,-36);x.quadraticCurveTo(-156,-84,-136,-124);x.lineTo(-104,-186);x.quadraticCurveTo(0,-204,104,-186);x.lineTo(136,-124);x.quadraticCurveTo(156,-84,152,-36);x.lineTo(138,-22);x.lineTo(-138,-22);x.fill();
  const wg=x.createLinearGradient(0,-188,0,-130);wg.addColorStop(0,"#020617");wg.addColorStop(.4,"#334155");wg.addColorStop(.75,"#1e293b");wg.addColorStop(1,"#090d16");
  x.fillStyle=wg;x.beginPath();x.moveTo(-96,-184);x.quadraticCurveTo(0,-195,96,-184);x.lineTo(118,-134);x.quadraticCurveTo(0,-125,-118,-134);x.fill();
  x.fillStyle="#090d16";x.fillRect(-135,-122,270,15);const lc=(brk||rev)?"#ff1e38":"#dc2626";x.fillStyle=lc;x.fillRect(-133,-118,266,4);
  new Array(-126,-110,-94,-78,-62,-46,34,50,66,82,98,114).forEach(lx=>{x.fillRect(lx,-111,11,3.5)});
  if(spd<-10){x.fillStyle="#fff";x.fillRect(-120,-112,26,3.5);x.fillRect(94,-112,26,3.5)}
  x.strokeStyle="#f8fafc";x.lineWidth=2;new Array(-18,-6,6,18).forEach(r=>{x.beginPath();x.arc(r,-114,7,0,Math.PI*2);x.stroke()});
  x.fillStyle="#090d16";x.beginPath();x.moveTo(-142,-34);x.lineTo(-126,-68);x.lineTo(126,-68);x.lineTo(142,-34);x.lineTo(128,-16);x.lineTo(-128,-16);x.fill();
  x.fillStyle="#f8fafc";x.fillRect(-48,-60,96,19);x.fillStyle="#2563eb";x.fillRect(-48,-60,8,19);x.fillStyle="#0f172a";x.font="bold 10px Arial";x.textAlign="center";x.fillText("AA-202-EV",3,-47);
  if(chg){x.strokeStyle="#4ade80";x.lineWidth=6;x.beginPath();x.moveTo(144,-82);x.quadraticCurveTo(190,-40,230,-85);x.stroke()}
  x.restore();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d,m=modes[mi],maxS=bat>0?m.ms:2100;let hp=0;
  if(brk){spd*=.85;if(Math.abs(spd)<30)spd=0}else if(acc&&bat>0){spd+=m.ac*dt;hp=Math.min(m.hp,Math.round(m.hp*.42+(spd/m.ms)*m.hp*.58))}else if(rev&&bat>0){if(spd>50){spd-=11e3*dt;hp=-120}else{spd-=3500*dt;hp=85}}else{spd-=750*dt*(spd>0?1:-1);if(Math.abs(spd)<25)spd=0;if(spd>200)hp=-25}
  spd=Math.max(-2100,Math.min(spd,maxS));pos=(pos+spd*dt+TL)%TL;const stepKm=Math.abs(spd/60)*(dt/3600)*10;dst+=stepKm;
  const idx=Math.floor(pos/L)%N,bs=segs[idx],maxR=.88+bs.rm*1.45,st=lft?-1:(rgt?1:0);
  if(Math.abs(spd)>10)px+=st*1.85*(spd>=0?1:-1)*dt;px-=bs.cv*(spd/12600)*.35*dt;if(px>maxR)px=Math.max(maxR,px-2.2*dt);if(px<-.88)px=-.88;
  tr.forEach(v=>{v.z+=(v.sp-spd)*dt;if(v.z<240)v.z=8800;if(v.z>9500)v.z=320});
  let chg=0;for(let o=-18;o<=18;o++)if(segs[(idx+o+N)%N].ch&&px>1.02&&Math.abs(spd)<4800)chg=1;
  const cb=document.getElementById('cb');
  if(chg){bat=Math.min(100,bat+(bat>80?2.2:4.5)*dt);cb.style.display="block";cb.innerText="⚡ RECHARGE TOTALENERGIES : "+Math.ceil(bat)+"%"}else{cb.style.display="none";if(acc&&bat>0)bat=Math.max(0,bat-(stepKm/4.5)*m.cn);else if(spd>200)bat=Math.min(100,bat+(stepKm/4.5)*(rev?.4:.15))}
  const g=document.getElementById('g');g.innerText=spd<-10?"R":"D";g.style.background=spd<-10?"#f59e0b":"#dc2626";
  document.getElementById('s').innerText=Math.abs(Math.round(spd/60));document.getElementById('p').innerText=hp;
  const bPct=Math.ceil(bat);document.getElementById('b').innerText=bPct+"%";document.getElementById('rng').innerText=Math.round((bat/100)*m.maxKm);document.getElementById('o').innerText=dst.toFixed(1);
  const bBar=document.getElementById('bBar');bBar.style.width=bPct+"%";bBar.style.background=chg?"#38bdf8":(bPct<20?"#ef4444":(bPct<50?"#f59e0b":"#4ade80"));
  const sky=x.createLinearGradient(0,0,0,H*.5);if(ngt){sky.addColorStop(0,"#020617");sky.addColorStop(1,"#0f172a")}else{sky.addColorStop(0,"#0284c7");sky.addColorStop(.55,"#38bdf8");sky.addColorStop(1,"#e0f2fe")}
  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);
  if(!ngt){
    const sg=x.createRadialGradient(W*.25,H*.16,8,W*.25,H*.16,95);sg.addColorStop(0,"#fff");sg.addColorStop(.35,"rgba(255,255,255,.8)");sg.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=sg;x.beginPath();x.arc(W*.25,H*.16,95,0,Math.PI*2);x.fill();
    const clouds=new Array({x:.14,y:.22,r:85},{x:.52,y:.14,r:120},{x:.78,y:.2,r:95});
    clouds.forEach(cl=>{const cg=x.createRadialGradient(W*cl.x,H*cl.y,10,W*cl.x,H*cl.y,cl.r);cg.addColorStop(0,"rgba(255,255,255,.92)");cg.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=cg;x.beginPath();x.arc(W*cl.x,H*cl.y,cl.r,0,Math.PI*2);x.fill()});
  }
  x.fillStyle=ngt?"#090d16":"#4d7c0f";x.fillRect(0,H*.5,W,H*.5);
  let rx=0,dx=-(bs.cv*((pos%L)/L)),pts=new Array();
  for(let n=0;n<115;n++){const s=segs[(idx+n)%N],sn=segs[(idx+n+1)%N],z1=Math.max(10,n*L-(pos%L)),z2=z1+L,sc1=.84/z1,sc2=.84/z2,x1=W/2-sc1*((px*R)+rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2-sc2*((px*R)+rx+dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;pts.push({s,sn,x1,y1,w1,x2,y2,w2,sc1});rx+=dx;dx+=s.cv}
  for(let i=pts.length-1;i>=0;i--){
    const {s,sn,x1,y1,w1,x2,y2,w2,sc1}=pts[i];
    if(y1>y2){
      x.fillStyle=ngt?(s.dk?"#142608":"#0f1d06"):(s.dk?"#65a30d":"#4d7c0f");x.fillRect(0,y2,W,y1-y2);
      const rg=x.createLinearGradient(x1-w1,y1,x1+w1,y1);rg.addColorStop(0,s.dk?"#4b5563":"#374151");rg.addColorStop(.5,s.dk?"#6b7280":"#4b5563");rg.addColorStop(1,s.dk?"#4b5563":"#374151");
      x.fillStyle=rg;x.beginPath();x.moveTo(x1-w1,y1);x.lineTo(x1+w1,y1);x.lineTo(x2+w2,y2);x.lineTo(x2-w2,y2);x.fill();
      x.fillStyle="#cbd5e1";x.fillRect(x1-w1*1.04,y1-(y1-y2)*2,w1*.05,(y1-y2)*2);
      if(s.rm<=0)x.fillRect(x1+w1*1.02,y1-(y1-y2)*2,w1*.05,(y1-y2)*2);
      x.fillStyle="#f8fafc";x.fillRect(x1-w1*.95,y1,w1*.04,y2-y1);x.fillRect(x1+w1*.91,y1,w1*.04,y2-y1);
      x.fillStyle="#facc15";x.fillRect(x1-w1*.03,y1,w1*.02,y2-y1);x.fillRect(x1+w1*.01,y1,w1*.02,y2-y1);
      if(s.dk){x.fillStyle="#fff";new Array(-.48,.48).forEach(l=>{x.beginPath();x.moveTo(x1+w1*l-w1*.016,y1);x.lineTo(x1+w1*l+w1*.016,y1);x.lineTo(x2+w2*l+w2*.015,y2);x.lineTo(x2+w2*l-w2*.015,y2);x.fill()})}
      if(s.rm>0||sn.rm>0){x.fillStyle="#334155";x.beginPath();x.moveTo(x1+w1,y1);x.lineTo(x1+w1*(1+s.rm*1.35),y1);x.lineTo(x2+w2*(1+sn.rm*1.35),y2);x.lineTo(x2+w2,y2);x.fill()}
    }
    if(s.gt)drawGantry(x1,y1,w1,sc1,s.gt);
    if(s.sg)drawRestSign(x1,y1,w1,sc1);
    if(s.trA&&s.rm<=0)drawScenery(x1,y1,w1,sc1,s.i);
    if(s.ch)drawStation(x1,y1,w1,sc1);
  }
  tr.slice().sort((a,b)=>b.z-a.z).forEach(drawCarDirect);drawAudi(st,brk,rev,chg);requestAnimationFrame(loop);
}
