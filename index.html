<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Audi A2 e-tron Paris HD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#38bdf8;font-family:Arial}
canvas{display:block;width:100%;height:100%}
#u{position:absolute;top:10px;left:10px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;border:2px solid #fff;border-left:6px solid #bb0a30;font-size:13px}
#h{position:absolute;bottom:10px;right:10px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;border:2px solid #fff;border-bottom:5px solid #bb0a30;font-size:13px;font-weight:bold}
#cb{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:8px 16px;border-radius:20px;font-weight:bold;display:none;border:2px solid #fff}
</style>
</head>
<body>
<div id="cb">⚡ RECHARGE TOTALENERGIES</div>
<div id="u"><b style="color:#60a5fa">AUDI A2 e-tron • PARIS (326 ch)</b><br>Flèches/ZQSD : Piloter | Bas/S : Frein & Recul<br>M : Mode | N : Nuit/Jour | H : Klaxon | R : Reset km | V : Bat 10%</div>
<div id="h"><span id="g" style="background:#bb0a30;padding:2px 6px;border-radius:4px">D</span> <span id="s" style="font-size:20px">0</span> km/h | <span id="p">0</span>/<span id="mp">326</span> ch<div id="md" style="font-size:11px;color:#ef4444">DYNAMIC (210 km/h)</div>🔋 <span id="b">85% (382 km)</span> | 🛣️ <span id="o">0.0</span> km</div>
<canvas id="c" width="1200" height="600"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=1200,H=600,ac=null,hn=0,mi=2,pos=0,px=0,spd=0,bat=85,dst=0,ngt=0,last=performance.now();
function fit(){W=c.width=innerWidth||1200;H=c.height=innerHeight||600}onresize=fit;fit();
function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
const segs=[],L=200,R=2200,N=600,TL=N*L;
for(let i=0;i<N;i++){let rm=0,sg=0,ch=0,trA=0;if(i==70)sg=1;if(i>=100&&i<130)rm=(i-100)/30;if(i>=130&&i<=260)rm=1;if(i>260&&i<=290)rm=1-(i-260)/30;if(i==210)ch=1;if(i>=120&&i<=270&&i%8==0)trA=1;segs.push({i,cv:(i>320&&i<430)?1.4:(i>460&&i<560)?-1.6:0,dk:Math.floor(i/3)%2==0,rm,sg,ch,trA})}
const tr=[{tk:1,z:1800,ln:.64,sp:4800,cl:"#f8fafc"},{tk:0,z:3600,ln:0,sp:7400,cl:"#9ca3af"},{tk:0,z:5800,ln:-.64,sp:8600,cl:"#dc2626"},{tk:1,z:8500,ln:.64,sp:4600,cl:"#e2e8f0"},{tk:0,z:12000,ln:0,sp:7000,cl:"#2563eb"}];
const modes=[{n:"EFFICIENCY (150 km/h)",ms:9000,hp:200,ac:5400,cn:.85,c:"#4ade80"},{n:"COMFORT (180 km/h)",ms:10800,hp:260,ac:6800,cn:1,c:"#60a5fa"},{n:"DYNAMIC (210 km/h)",ms:12600,hp:326,ac:8500,cn:1.15,c:"#ef4444"}];
const k={};
onkeydown=e=>{let v=e.key.toLowerCase();k[v]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(v))e.preventDefault();if(v=='v')bat=10;if(v=='n')ngt=1-ngt;if(v=='h'||v=='k')horn();if(v=='r')dst=0;if(v=='m'){mi=(mi+1)%3;let m=modes[mi],el=document.getElementById('md');el.innerText=m.n;el.style.color=m.c;document.getElementById('mp').innerText=m.hp}};
onkeyup=e=>{let v=e.key.toLowerCase();k[v]=0;if(v=='h'||v=='k')hn=0};
function drawAudi(st,brk,rev,chg){
  x.save();x.translate(W/2+st*50,H-28);x.rotate(st*.055);
  if(ngt||hn){const bm=x.createLinearGradient(0,-135,0,-370);bm.addColorStop(0,hn?"rgba(255,255,255,.65)":"rgba(224,242,254,.4)");bm.addColorStop(1,"rgba(224,242,254,0)");x.fillStyle=bm;x.beginPath();x.moveTo(-88,-135);x.lineTo(-230,-370);x.lineTo(230,-370);x.lineTo(88,-135);x.fill()}
  x.fillStyle="rgba(0,0,0,.65)";x.beginPath();x.ellipse(0,8,142,24,0,0,Math.PI*2);x.fill();
  [-118,82].forEach(wx=>{x.fillStyle="#09090b";x.beginPath();x.roundRect(wx,-46,36,56,7);x.fill();x.strokeStyle="#52525b";x.lineWidth=1.5;x.strokeRect(wx+4,-42,28,48)});
  const bg=x.createLinearGradient(0,-152,0,0);bg.addColorStop(0,"#3b82f6");bg.addColorStop(.28,"#1d4ed8");bg.addColorStop(.65,"#172554");bg.addColorStop(1,"#090d16");
  x.fillStyle=bg;x.beginPath();x.moveTo(-124,-14);x.quadraticCurveTo(-126,-55,-112,-84);x.lineTo(-82,-146);x.quadraticCurveTo(0,-158,82,-146);x.lineTo(112,-84);x.quadraticCurveTo(126,-55,124,-14);x.quadraticCurveTo(0,-4,-124,-14);x.fill();
  x.fillStyle="rgba(255,255,255,.18)";x.beginPath();x.ellipse(0,-143,66,5,0,0,Math.PI*2);x.fill();
  const wg=x.createLinearGradient(0,-140,0,-84);wg.addColorStop(0,"#020617");wg.addColorStop(.5,"#1e293b");wg.addColorStop(1,"#090d16");
  x.fillStyle=wg;x.beginPath();x.moveTo(-74,-139);x.quadraticCurveTo(0,-146,74,-139);x.lineTo(96,-85);x.quadraticCurveTo(0,-79,-96,-85);x.fill();
  x.strokeStyle="rgba(255,255,255,.28)";x.lineWidth=2;x.beginPath();x.moveTo(-64,-132);x.lineTo(-22,-90);x.moveTo(-50,-133);x.lineTo(-10,-90);x.stroke();
  [-120,104].forEach(mx=>{x.fillStyle="#1e3a8a";x.beginPath();x.roundRect(mx,-94,16,10,4);x.fill()});
  x.fillStyle="#090d16";x.beginPath();x.roundRect(-114,-82,228,15,5);x.fill();
  x.fillStyle=(brk||rev)?"#ff1e38":"#dc2626";x.shadowColor="#ef4444";x.shadowBlur=(brk||rev)?16:6;
  x.fillRect(-108,-77,216,5);for(let i=-106;i<=102;i+=14)x.fillRect(i,-71,9,3);x.shadowBlur=0;
  if(spd<-10){x.fillStyle="#fff";x.fillRect(-100,-76,22,4);x.fillRect(78,-76,22,4)}
  x.fillStyle="#e2e8f0";x.fillRect(-34,-45,68,14);x.fillStyle="#2563eb";x.fillRect(-34,-45,7,14);x.fillStyle="#0f172a";x.font="bold 9px Arial";x.textAlign="center";x.fillText("AA-202-EV",0,-35);
  x.strokeStyle="#f8fafc";x.lineWidth=2.2;[-18,-6,6,18].forEach(r=>{x.beginPath();x.arc(r,-60,6.5,0,Math.PI*2);x.stroke()});
  x.fillStyle="#cbd5e1";x.font="bold 8px Arial";x.fillText("A2",-88,-48);x.fillText("e-tron",86,-48);
  x.fillStyle="#18181b";x.beginPath();x.moveTo(-110,-12);x.lineTo(-96,-24);x.lineTo(96,-24);x.lineTo(110,-12);x.fill();
  x.strokeStyle="#60a5fa";x.lineWidth=2;x.beginPath();x.moveTo(-92,-22);x.lineTo(92,-22);x.stroke();
  if(chg){x.strokeStyle="#4ade80";x.lineWidth=6;x.beginPath();x.moveTo(118,-55);x.quadraticCurveTo(165,-25,205,-65);x.stroke()}
  x.restore();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d,m=modes[mi],maxS=bat>0?m.ms:2100;let hp=0;
  if(brk){spd*=.85;if(Math.abs(spd)<30)spd=0}else if(acc&&bat>0){spd+=m.ac*dt;hp=Math.min(m.hp,Math.round(m.hp*.42+(spd/m.ms)*m.hp*.58))}else if(rev&&bat>0){if(spd>50){spd-=11e3*dt;hp=-120}else{spd-=3500*dt;hp=85}}else{spd-=750*dt*(spd>0?1:-1);if(Math.abs(spd)<25)spd=0;if(spd>200)hp=-25}
  spd=Math.max(-2100,Math.min(spd,maxS));pos=(pos+spd*dt+TL)%TL;const stepKm=Math.abs(spd/60)*(dt/3600)*10;dst+=stepKm;
  const idx=Math.floor(pos/L)%N,bs=segs[idx],maxR=.92+bs.rm*1.1,st=lft?-1:(rgt?1:0);
  if(Math.abs(spd)>10)px+=st*1.85*(spd>=0?1:-1)*dt;px-=bs.cv*(spd/12600)*.4*dt;if(px>maxR)px=Math.max(maxR,px-2.2*dt);if(px<-.92)px=-.92;
  tr.forEach(v=>{v.z+=(v.sp-spd)*dt;if(v.z<280)v.z=20000;if(v.z>21000)v.z=400});
  let chg=0;for(let o=-15;o<=15;o++)if(segs[(idx+o+N)%N].ch&&px>1.05&&Math.abs(spd)<4800)chg=1;
  const cb=document.getElementById('cb');
  if(chg){bat=Math.min(100,bat+(bat>80?2.2:4.5)*dt);cb.style.display="block";cb.innerText="⚡ RECHARGE TOTALENERGIES : "+Math.ceil(bat)+"%"}
  else{cb.style.display="none";if(acc&&bat>0)bat=Math.max(0,bat-(stepKm/4.5)*m.cn);else if(spd>200)bat=Math.min(100,bat+(stepKm/4.5)*(rev?.4:.15))}
  const g=document.getElementById('g');g.innerText=spd<-10?"R":"D";g.style.background=spd<-10?"#f59e0b":"#bb0a30";
  document.getElementById('s').innerText=Math.abs(Math.round(spd/60));document.getElementById('p').innerText=hp;document.getElementById('b').innerText=Math.ceil(bat)+"% ("+Math.round(bat*4.5)+" km)";document.getElementById('o').innerText=dst.toFixed(1);
  const sky=x.createLinearGradient(0,0,0,H*.5);if(ngt){sky.addColorStop(0,"#020617");sky.addColorStop(1,"#0f172a")}else{sky.addColorStop(0,"#0369a1");sky.addColorStop(.6,"#38bdf8");sky.addColorStop(1,"#e0f2fe")}
  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);if(ngt){x.fillStyle="#fff";for(let i=0;i<30;i++)x.fillRect((i*197)%W,(i*83)%(H*.42),2,2)}else{x.fillStyle="#fde047";x.beginPath();x.arc(W*.82,H*.16,36,0,Math.PI*2);x.fill();x.fillStyle="rgba(255,255,255,.55)";[[.2,.18,55],[.55,.14,70],[.72,.24,48]].forEach(cl=>{x.beginPath();x.arc(W*cl[0],H*cl[1],cl[2],0,Math.PI*2);x.arc(W*cl[0]+cl[2]*.7,H*cl[1]+6,cl[2]*.75,0,Math.PI*2);x.fill()})}
  const ex=W*.5-px*110,ey=H*.5;x.strokeStyle=ngt?"#f59e0b":"#78350f";x.lineWidth=3;x.beginPath();x.moveTo(ex-55,ey);x.quadraticCurveTo(ex-22,ey-80,ex-8,ey-200);x.lineTo(ex+8,ey-200);x.quadraticCurveTo(ex+22,ey-80,ex+55,ey);x.stroke();x.beginPath();x.arc(ex,ey,26,Math.PI,0);x.stroke();x.fillStyle=ngt?"#f59e0b":"#78350f";x.fillRect(ex-35,ey-55,70,5);x.fillRect(ex-19,ey-115,38,4);
  x.fillStyle=ngt?"#090d16":"#3f6212";x.fillRect(0,H*.5,W,H*.5);
  let rx=0,dx=-(bs.cv*((pos%L)/L)),pts=[];
  for(let n=0;n<115;n++){
    const s=segs[(idx+n)%N],sn=segs[(idx+n+1)%N],z1=Math.max(10,n*L-(pos%L)),z2=z1+L,sc1=.84/z1,sc2=.84/z2;
    const x1=W/2-sc1*((px*R)+rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2-sc2*((px*R)+rx+dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;
    pts.push({n,s,sn,x1,y1,w1,x2,y2,w2,sc1});rx+=dx;dx+=s.cv;
  }
  for(let i=pts.length-1;i>=0;i--){
    const {n,s,sn,x1,y1,w1,x2,y2,w2,sc1}=pts[i];
    if(y1>y2){
      x.fillStyle=ngt?(s.dk?"#142608":"#0f1d06"):(s.dk?"#4d7c0f":"#3f6212");x.fillRect(0,y2,W,y1-y2);
      x.fillStyle=ngt?(s.dk?"#1e293b":"#0f172a"):(s.dk?"#374151":"#2d3748");x.beginPath();x.moveTo(x1-w1,y1);x.lineTo(x1+w1,y1);x.lineTo(x2+w2,y2);x.lineTo(x2-w2,y2);x.fill();
      x.fillStyle="#cbd5e1";x.fillRect(x1-w1*1.04,y1-(y1-y2)*1.6,w1*.03,(y1-y2)*1.6);
      x.fillStyle="#f97316";x.beginPath();x.moveTo(x1-w1*.96,y1);x.lineTo(x1-w1*.92,y1);x.lineTo(x2-w2*.92,y2);x.lineTo(x2-w2*.96,y2);x.fill();
      if(s.dk){x.fillStyle="#fff";[-.33,.33].forEach(l=>{x.beginPath();x.moveTo(x1+w1*l-w1*.016,y1);x.lineTo(x1+w1*l+w1*.016,y1);x.lineTo(x2+w2*l+w2*.016,y2);x.lineTo(x2+w2*l-w2*.016,y2);x.fill()})}
      if(s.rm>0||sn.rm>0){x.fillStyle=s.dk?"#facc15":"#fff";x.beginPath();x.moveTo(x1+w1,y1);x.lineTo(x1+w1*(1+s.rm*.22),y1);x.lineTo(x2+w2*(1+sn.rm*.22),y2);x.lineTo(x2+w2,y2);x.fill();x.fillStyle="#334155";x.beginPath();x.moveTo(x1+w1*(1+s.rm*.22),y1);x.lineTo(x1+w1*(1+s.rm*1.2),y1);x.lineTo(x2+w2*(1+sn.rm*1.2),y2);x.lineTo(x2+w2*(1+sn.rm*.22),y2);x.fill()}
    }
    if(s.sg){const ss=sc1*18e4;if(ss>6&&ss<600){const sx=x1+w1*1.15;x.fillStyle="#cbd5e1";x.fillRect(sx-ss*.04,y1-ss,ss*.08,ss);x.fillStyle="#1d4ed8";x.fillRect(sx-ss*.8,y1-ss*1.45,ss*1.6,ss*.55);x.strokeStyle="#fff";x.lineWidth=3;x.strokeRect(sx-ss*.8,y1-ss*1.45,ss*1.6,ss*.55);if(ss>22){x.fillStyle="#fff";x.font="bold "+Math.round(ss*.105)+"px Arial";x.textAlign="center";x.fillText("SORTIE ↗ TOTALENERGIES 200m",sx,y1-ss*1.14)}}}
    if(s.trA){const ts=sc1*15e4;if(ts>6&&ts<500){const tx=x1+w1*2.65;x.fillStyle="#78350f";x.fillRect(tx-ts*.07,y1-ts*.45,ts*.14,ts*.45);x.fillStyle=ngt?"#064e3b":"#16a34a";x.beginPath();x.arc(tx,y1-ts*.65,ts*.36,0,Math.PI*2);x.fill()}}
    if(s.ch){const cs=sc1*16e4;if(cs>6&&cs<550){const cx=x1+w1*2.25;x.fillStyle="#ed1c24";x.beginPath();x.ellipse(x1+w1*1.7,y1,w1*.45,cs*.25,0,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.fillRect(cx-cs*.55,y1-cs,cs*1.1,cs*.16);x.fillStyle="#ed1c24";x.fillRect(cx-cs*.55,y1-cs*.88,cs*1.1,cs*.06);x.fillStyle="#fff";x.fillRect(cx-cs*.14,y1-cs*.55,cs*.28,cs*.55);if(cs>28){x.font="bold "+Math.round(cs*.095)+"px Arial";x.textAlign="center";x.fillText("TotalEnergies",cx,y1-cs*.91)}}}
  }
  tr.slice().sort((a,b)=>b.z-a.z).forEach(v=>{
    const sc=.84/v.z,vy=H/2+sc*1e3*H/2,vw=sc*R*W/2,vx=W/2-sc*(px*R)*W/2+v.ln*vw,w=sc*(v.tk?1900:1500),h=sc*(v.tk?2800:1100);
    if(w>5&&vy<=H+40){x.save();x.translate(vx,vy);x.fillStyle="rgba(0,0,0,.5)";x.beginPath();x.ellipse(0,4,w*.55,h*.08,0,0,Math.PI*2);x.fill();x.fillStyle="#111";x.fillRect(-w*.46,-h*.22,w*.17,h*.22);x.fillRect(w*.29,-h*.22,w*.17,h*.22);x.fillStyle=v.cl;x.beginPath();x.roundRect(-w*.48,-h,w*.96,h*.86,w*.05);x.fill();if(v.tk){x.strokeStyle="#94a3b8";x.lineWidth=1.5;x.strokeRect(-w*.42,-h*.94,w*.4,h*.74);x.strokeRect(w*.02,-h*.94,w*.4,h*.74);x.fillStyle="#ef4444";x.fillRect(-w*.45,-h*.14,w*.22,h*.05);x.fillRect(w*.23,-h*.14,w*.22,h*.05);if(w>18){x.strokeStyle="#1e293b";x.lineWidth=2;x.beginPath();x.arc(0,-h*.56,w*.13,0,Math.PI*2);x.stroke();x.fillStyle="#111";x.font="bold "+Math.round(w*.1)+"px Arial";x.textAlign="center";x.fillText("MERCEDES",0,-h*.8)}}else{x.fillStyle="#0f172a";x.beginPath();x.roundRect(-w*.36,-h*.9,w*.72,h*.36,w*.06);x.fill();x.fillStyle="#ff1e1e";x.fillRect(-w*.44,-h*.48,w*.88,h*.07)}x.restore()}
  });
  drawAudi(st,brk,rev,chg);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
