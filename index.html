function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
const segs=[],L=200,R=2200,N=600,TL=N*L;
for(let i=0;i<N;i++){let rm=0,sg=0,ch=0,trA=0,gt=0;if(i==45||i==340)gt=1;if(i==75)sg=1;if(i>=95&&i<125)rm=(i-95)/30;if(i>=125&&i<=275)rm=1;if(i>275&&i<=305)rm=1-(i-275)/30;if(i==205)ch=1;if(i>=115&&i<=280&&i%6==0)trA=1;segs.push({i,cv:(i>320&&i<430)?1.1:(i>460&&i<560)?-1.3:0,dk:Math.floor(i/3)%2==0,rm,sg,ch,trA,gt})}

function drawTraffic(v,p){

function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d,m=modes[mi],maxS=bat>0?m.ms:2100;let hp=0;

  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);if(ngt){x.fillStyle="#fff";for(let i=0;i<30;i++)x.fillRect((i*197)%W,(i*83)%(H*.42),2,2)}else{x.fillStyle="#fef08a";x.beginPath();x.arc(W*.82,H*.16,38,0,Math.PI*2);x.fill();[[.16,.18,68],[.46,.14,85],[.74,.22,60],[.32,.26,52]].forEach(cl=>{x.fillStyle="rgba(255,255,255,.78)";x.beginPath();x.arc(W*cl,H*cl,cl,0,Math.PI*2);x.arc(W*cl+cl*.7,H*cl+6,cl*.75,0,Math.PI*2);x.arc(W*cl-cl*.6,H*cl+8,cl*.65,0,Math.PI*2);x.fill()})}
  x.fillStyle=ngt?"#090d16":"#3f6212";x.beginPath();x.moveTo(0,H*.5);x.quadraticCurveTo(W*.22,H*.44,W*.5,H*.48);x.quadraticCurveTo(W*.78,H*.43,W,H*.5);x.fill();
  const ex=W*.5-px*110,ey=H*.5;x.strokeStyle=ngt?"#f59e0b":"#78350f";x.lineWidth=3;x.beginPath();x.moveTo(ex-55,ey);x.quadraticCurveTo(ex-22,ey-80,ex-8,ey-200);x.lineTo(ex+8,ey-200);x.quadraticCurveTo(ex+22,ey-80,ex+55,ey);x.stroke();x.beginPath();x.arc(ex,ey,26,Math.PI,0);x.stroke();x.fillStyle=ngt?"#f59e0b":"#78350f";x.fillRect(ex-35,ey-55,70,5);x.fillRect(ex-19,ey-115,38,4);
  x.fillStyle=ngt?"#090d16":"#4d7c0f";x.fillRect(0,H*.5,W,H*.5);
  let rx=0,dx=-(bs.cv*((pos%L)/L)),pts=[];

    const x1=W/2-sc1*((px*R)+rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2-sc2*((px*R)+rx+dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;

      x.fillStyle=rg;x.beginPath();x.moveTo(x1-w1*1.85,y1);x.lineTo(x1+w1,y1);x.lineTo(x2+w2,y2);x.lineTo(x2-w2*1.85,y2);x.fill();
      x.fillStyle="#94a3b8";x.fillRect(x1-w1*1.04,y1-(y1-y2)*2.3,w1*.08,(y1-y2)*2.3);
