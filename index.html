<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Audi A2 e-tron Paris GT</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#38bdf8;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#u{position:absolute;top:16px;left:16px;background:rgba(15,23,42,.95);color:#fff;padding:18px 24px;border-radius:14px;border:3px solid #fff;border-left:10px solid #bb0a30;font-size:16px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#h{position:absolute;bottom:16px;right:16px;background:rgba(15,23,42,.95);color:#fff;padding:18px 24px;border-radius:14px;border:3px solid #fff;border-bottom:8px solid #bb0a30;font-size:17px;font-weight:bold;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#cb{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:14px 28px;border-radius:24px;font-size:18px;font-weight:bold;display:none;border:3px solid #fff}
</style>
</head>
<body>
<div id="cb">⚡ RECHARGE ULTRA-RAPIDE TOTALENERGIES</div>
<div id="u"><b style="color:#60a5fa;font-size:20px">AUDI A2 e-tron • PARIS (326 ch)</b><br><b>Flèches / ZQSD</b> : Piloter | <b>Bas / S</b> : Frein & Recul<br><b>M</b> : Mode | <b>N</b> : Nuit/Jour | <b>H</b> : Klaxon | <b>R</b> : Reset km | <b>V</b> : Bat 10%</div>
<div id="h"><span id="g" style="background:#bb0a30;padding:4px 10px;border-radius:6px;font-size:18px">D</span> <span id="s" style="font-size:28px">0</span> km/h | <span id="p">0</span>/<span id="mp">326</span> ch<div id="md" style="font-size:14px;color:#ef4444;margin:4px 0">DYNAMIC (210 km/h)</div>🔋 <span id="b">85% (382 km)</span> | 🛣️ <span id="o">0.0</span> km</div>
<canvas id="c" width="1200" height="600"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=1200,H=600,ac=null,hn=0,mi=2,pos=0,px=0,spd=0,bat=85,dst=0,ngt=0,last=performance.now();
function fit(){W=c.width=innerWidth||1200;H=c.height=innerHeight||600}onresize=fit;fit();
function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
const segs=[],L=200,R=2200,N=600,TL=N*L;
for(let i=0;i<N;i++){let rm=0,sg=0,ch=0,trA=0;if(i==70)sg=1;if(i>=100&&i<130)rm=(i-100)/30;if(i>=130&&i<=260)rm=1;if(i>260&&i<=290)rm=1-(i-260)/30;if(i==210)ch=1;if(i>=120&&i<=270&&i%8==0)trA=1;segs.push({i,cv:(i>320&&i<430)?1.2:(i>460&&i<560)?-1.4:0,dk:Math.floor(i/3)%2==0,rm,sg,ch,trA,lp:i%12==0})}
const tr=[{tk:1,z:1400,ln:.62,sp:4800,cl:"#f8fafc"},{tk:0,z:2800,ln:0,sp:7400,cl:"#9ca3af"},{tk:0,z:4800,ln:-.62,sp:8600,cl:"#dc2626"},{tk:1,z:7200,ln:.62,sp:4600,cl:"#e2e8f0"},{tk:0,z:10500,ln:0,sp:7000,cl:"#2563eb"}];
const modes=[{n:"EFFICIENCY (150 km/h)",ms:9000,hp:200,ac:5400,cn:.85,c:"#4ade80"},{n:"COMFORT (180 km/h)",ms:10800,hp:260,ac:6800,cn:1,c:"#60a5fa"},{n:"DYNAMIC (210 km/h)",ms:12600,hp:326,ac:8500,cn:1.15,c:"#ef4444"}];
const k={};
onkeydown=e=>{let v=e.key.toLowerCase();k[v]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(v))e.preventDefault();if(v=='v')bat=10;if(v=='n')ngt=1-ngt;if(v=='h'||v=='k')horn();if(v=='r')dst=0;if(v=='m'){mi=(mi+1)%3;let m=modes[mi],el=document.getElementById('md');el.innerText=m.n;el.style.color=m.c;document.getElementById('mp').innerText=m.hp}};
onkeyup=e=>{let v=e.key.toLowerCase();k[v]=0;if(v=='h'||v=='k')hn=0};
function drawStation(x1,y1,w1,sc1){
  const cs=sc1*22e4;if(cs<6||cs>650)return;
  const cx=x1+w1*2.35;
  x.fillStyle="#cbd5e1";x.beginPath();x.ellipse(x1+w1*1.9,y1,w1*.75,cs*.32,0,0,Math.PI*2);x.fill();
  x.fillStyle="#dc2626";x.beginPath();x.ellipse(x1+w1*1.75,y1,w1*.48,cs*.22,0,0,Math.PI*2);x.fill();
  x.fillStyle="#f8fafc";x.fillRect(cx-cs*.85,y1-cs*1.12,cs*1.7,cs*.2);
  x.fillStyle="#ef4444";x.fillRect(cx-cs*.85,y1-cs*.96,cs*1.7,cs*.07);
  x.fillStyle="#2563eb";x.fillRect(cx-cs*.85,y1-cs*.89,cs*1.7,cs*.04);
  [-.55,.55].forEach(p=>{x.fillStyle="#475569";x.fillRect(cx+cs*p-cs*.05,y1-cs*.85,cs*.1,cs*.85)});
  [-.25,.25].forEach(b=>{x.fillStyle="#f8fafc";x.fillRect(cx+cs*b-cs*.09,y1-cs*.58,cs*.18,cs*.58);x.fillStyle="#0f172a";x.fillRect(cx+cs*b-cs*.06,y1-cs*.52,cs*.12,cs*.16);x.fillStyle="#38bdf8";x.fillRect(cx+cs*b-cs*.04,y1-cs*.5,cs*.08,cs*.08)});
  const tx=x1+w1*1.28;x.fillStyle="#0f172a";x.fillRect(tx-cs*.12,y1-cs*1.25,cs*.24,cs*1.25);x.fillStyle="#ef4444";x.fillRect(tx-cs*.12,y1-cs*1.25,cs*.24,cs*.22);
  if(cs>28){x.fillStyle="#0f172a";x.font="bold "+Math.round(cs*.1)+"px Arial";x.textAlign="center";x.fillText("TotalEnergies • 300 kW",cx,y1-cs*1.01)}
}
function drawTraffic(v,p){
  const vx=p.x1+v.ln*p.w1,w=p.sc1*(v.tk?2100:1550),h=p.sc1*(v.tk?3100:1150);
  if(w<4||p.y1>H+60)return;
  x.save();x.translate(vx,p.y1);
  x.fillStyle="rgba(0,0,0,.6)";x.beginPath();x.ellipse(0,4,w*.58,h*.09,0,0,Math.PI*2);x.fill();
  x.fillStyle="#09090b";x.fillRect(-w*.46,-h*.22,w*.17,h*.22);x.fillRect(w*.29,-h*.22,w*.17,h*.22);
  const g=x.createLinearGradient(0,-h,0,0);g.addColorStop(0,v.cl);g.addColorStop(1,"#64748b");
  x.fillStyle=g;x.fillRect(-w*.48,-h,w*.96,h*.86);
  if(v.tk){
    x.strokeStyle="#94a3b8";x.lineWidth=1.5;x.strokeRect(-w*.42,-h*.94,w*.4,h*.74);x.strokeRect(w*.02,-h*.94,w*.4,h*.74);
    x.fillStyle="#1e293b";x.fillRect(-w*.48,-h*.16,w*.96,h*.07);
    x.fillStyle="#ef4444";x.fillRect(-w*.45,-h*.15,w*.2,h*.05);x.fillRect(w*.25,-h*.15,w*.2,h*.05);
    if(w>16){x.strokeStyle="#0f172a";x.lineWidth=2;x.beginPath();x.arc(0,-h*.56,w*.13,0,Math.PI*2);x.stroke();x.fillStyle="#0f172a";x.font="bold "+Math.round(w*.1)+"px Arial";x.textAlign="center";x.fillText("MERCEDES",0,-h*.8)}
  }else{
    x.fillStyle="#020617";x.fillRect(-w*.36,-h*.9,w*.72,h*.36);
    x.fillStyle="#ff1e1e";x.fillRect(-w*.44,-h*.48,w*.88,h*.07);
  }
  x.restore();
}
function drawAudi(st,brk,rev,chg){
  x.save();x.translate(W/2+st*50,H-28);x.rotate(st*.055);
  if(ngt||hn){const bm=x.createLinearGradient(0,-135,0,-370);bm.addColorStop(0,hn?"rgba(255,255,255,.65)":"rgba(224,242,254,.4)");bm.addColorStop(1,"rgba(224,242,254,0)");x.fillStyle=bm;x.beginPath();x.moveTo(-88,-135);x.lineTo(-230,-370);x.lineTo(230,-370);x.lineTo(88,-135);x.fill()}
  x.fillStyle="rgba(0,0,0,.72)";x.beginPath();x.ellipse(0,8,144,25,0,0,Math.PI*2);x.fill();
  [-118,82].forEach(wx=>{x.fillStyle="#09090b";x.fillRect(wx,-46,36,56);x.strokeStyle="#52525b";x.lineWidth=1.5;x.strokeRect(wx+4,-42,28,48)});
  const bg=x.createLinearGradient(0,-152,0,0);bg.addColorStop(0,"#60a5fa");bg.addColorStop(.25,"#1d4ed8");bg.addColorStop(.65,"#172554");bg.addColorStop(1,"#090d16");
  x.fillStyle=bg;x.beginPath();x.moveTo(-124,-14);x.quadraticCurveTo(-126,-55,-112,-84);x.lineTo(-82,-146);x.quadraticCurveTo(0,-158,82,-146);x.lineTo(112,-84);x.quadraticCurveTo(126,-55,124,-14);x.quadraticCurveTo(0,-4,-124,-14);x.fill();
  const wg=x.createLinearGradient(0,-140,0,-84);wg.addColorStop(0,"#020617");wg.addColorStop(.5,"#1e293b");wg.addColorStop(1,"#090d16");
  x.fillStyle=wg;x.beginPath();x.moveTo(-74,-139);x.quadraticCurveTo(0,-146,74,-139);x.lineTo(96,-85);x.quadraticCurveTo(0,-79,-96,-85);x.fill();
  x.fillStyle="#090d16";x.fillRect(-114,-82,228,15);
  x.fillStyle=(brk||rev)?"#ff1e38":"#dc2626";x.fillRect(-108,-77,216,5);
  x.fillStyle="#e2e8f0";x.fillRect(-34,-45,68,14);x.fillStyle="#2563eb";x.fillRect(-34,-45,7,14);x.fillStyle="#0f172a";x.font="bold 9px Arial";x.textAlign="center";x.fillText("AA-202-EV",0,-35);
  x.strokeStyle="#f8fafc";x.lineWidth=2.2;[-18,-6,6,18].forEach(r=>{x.beginPath();x.arc(r,-60,6.5,0,Math.PI*2);x.stroke()});
  if(chg){x.strokeStyle="#4ade80";x.lineWidth=6;x.beginPath();x.moveTo(118,-55);x.quadraticCurveTo(165,-25,205,-65);x.stroke()}
  x.restore();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d,m=modes[mi],maxS=bat>0?m.ms:2100;let hp=0;
  if(brk){spd*=.85;if(Math.abs(spd)<30)spd=0}else if(acc&&bat>0){spd+=m.ac*dt;hp=Math.min(m.hp,Math.round(m.hp*.42+(spd/m.ms)*m.hp*.58))}else if(rev&&bat>0){if(spd>50){spd-=11e3*dt;hp=-120}else{spd-=3500*dt;hp=85}}else{spd-=750*dt*(spd>0?1:-1);if(Math.abs(spd)<25)spd=0;if(spd>200)hp=-25}
  spd=Math.max(-2100,Math.min(spd,maxS));pos=(pos+spd*dt+TL)%TL;const stepKm=Math.abs(spd/60)*(dt/3600)*10;dst+=stepKm;
  const idx=Math.floor(pos/L)%N,bs=segs[idx],maxR=.92+bs.rm*1.1,st=lft?-1:(rgt?1:0);
  if(Math.abs(spd)>10)px+=st*1.85*(spd>=0?1:-1)*dt;px-=bs.cv*(spd/12600)*.4*dt;if(px>maxR)px=Math.max(maxR,px-2.2*dt);if(px<-.92)px=-.92;
  tr.forEach(v=>{v.z+=(v.sp-spd)*dt;if(v.z<280)v.z=19000;if(v.z>20000)v.z=400});
  let chg=0;for(let o=-15;o<=15;o++)if(segs[(idx+o+N)%N].ch&&px>1.05&&Math.abs(spd)<4800)chg=1;
  const cb=document.getElementById('cb');
  if(chg){bat=Math.min(100,bat+(bat>80?2.2:4.5)*dt);cb.style.display="block";cb.innerText="⚡ RECHARGE ULTRA-RAPIDE TOTALENERGIES : "+Math.ceil(bat)+"%"}
  else{cb.style.display="none";if(acc&&bat>0)bat=Math.max(0,bat-(stepKm/4.5)*m.cn);else if(spd>200)bat=Math.min(100,bat+(stepKm/4.5)*(rev?.4:.15))}
  const g=document.getElementById('g');g.innerText=spd<-10?"R":"D";g.style.background=spd<-10?"#f59e0b":"#bb0a30";
  document.getElementById('s').innerText=Math.abs(Math.round(spd/60));document.getElementById('p').innerText=hp;document.getElementById('b').innerText=Math.ceil(bat)+"% ("+Math.round(bat*4.5)+" km)";document.getElementById('o').innerText=dst.toFixed(1);
  const sky=x.createLinearGradient(0,0,0,H*.5);if(ngt){sky.addColorStop(0,"#020617");sky.addColorStop(1,"#0f172a")}else{sky.addColorStop(0,"#0369a1");sky.addColorStop(.55,"#38bdf8");sky.addColorStop(1,"#e0f2fe")}
  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);if(ngt){x.fillStyle="#fff";for(let i=0;i<30;i++)x.fillRect((i*197)%W,(i*83)%(H*.42),2,2)}else{x.fillStyle="#fef08a";x.beginPath();x.arc(W*.82,H*.16,38,0,Math.PI*2);x.fill();x.fillStyle="rgba(255,255,255,.65)";[[.18,.18,55],[.52,.14,72],[.72,.23,48]].forEach(cl=>{x.beginPath();x.arc(W*cl[0],H*cl[1],cl[2],0,Math.PI*2);x.arc(W*cl[0]+cl[2]*.7,H*cl[1]+6,cl[2]*.75,0,Math.PI*2);x.fill()})}
  x.fillStyle=ngt?"#090d16":"#4d7c0f";x.beginPath();x.moveTo(0,H*.5);x.quadraticCurveTo(W*.25,H*.43,W*.5,H*.48);x.quadraticCurveTo(W*.78,H*.42,W,H*.5);x.fill();
  const ex=W*.5-px*110,ey=H*.5;x.strokeStyle=ngt?"#f59e0b":"#78350f";x.lineWidth=3;x.beginPath();x.moveTo(ex-55,ey);x.quadraticCurveTo(ex-22,ey-80,ex-8,ey-200);x.lineTo(ex+8,ey-200);x.quadraticCurveTo(ex+22,ey-80,ex+55,ey);x.stroke();x.beginPath();x.arc(ex,ey,26,Math.PI,0);x.stroke();x.fillStyle=ngt?"#f59e0b":"#78350f";x.fillRect(ex-35,ey-55,70,5);x.fillRect(ex-19,ey-115,38,4);
  x.fillStyle=ngt?"#090d16":"#3f6212";x.fillRect(0,H*.5,W,H*.5);
  let rx=0,dx=-(bs.cv*((pos%L)/L)),pts=[];
  for(let n=0;n<115;n++){
    const s=segs[(idx+n)%N],sn=segs[(idx+n+1)%N],z1=Math.max(10,n*L-(pos%L)),z2=z1+L,sc1=.84/z1,sc2=.84/z2;
    const x1=W/2-sc1*((px*R)+rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2-sc2*((px*R)+rx+dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;
    pts.push({n,s,sn,x1,y1,w1,x2,y2,w2,sc1});rx+=dx;dx+=s.cv;
  }
  for(let i=pts.length-1;i>=0;i--){
    const {n,s,sn,x1,y1,w1,x2,y2,w2,sc1}=pts[i];
    if(y1>y2){
      x.fillStyle=ngt?(s.dk?"#142608":"#0f1d06"):(s.dk?"#4d7c0f":"#365314");x.fillRect(0,y2,W,y1-y2);
      const rg=x.createLinearGradient(x1-w1,y1,x1+w1,y1);
      if(ngt){rg.addColorStop(0,"#0f172a");rg.addColorStop(.5,"#1e293b");rg.addColorStop(1,"#0f172a")}
      else{rg.addColorStop(0,s.dk?"#334155":"#1e293b");rg.addColorStop(.5,s.dk?"#475569":"#334155");rg.addColorStop(1,s.dk?"#334155":"#1e293b")}
      x.fillStyle=rg;x.beginPath();x.moveTo(x1-w1,y1);x.lineTo(x1+w1,y1);x.lineTo(x2+w2,y2);x.lineTo(x2-w2,y2);x.fill();
      x.fillStyle="#94a3b8";x.fillRect(x1-w1*1.06,y1-(y1-y2)*2.2,w1*.05,(y1-y2)*2.2);
      x.fillStyle="#cbd5e1";x.fillRect(x1-w1*1.05,y1-(y1-y2)*1.5,w1*.04,(y1-y2)*.6);
      x.fillStyle="#f97316";x.beginPath();x.moveTo(x1-w1*.96,y1);x.lineTo(x1-w1*.91,y1);x.lineTo(x2-w2*.91,y2);x.lineTo(x2-w2*.96,y2);x.fill();
      x.fillStyle="#e2e8f0";x.beginPath();x.moveTo(x1+w1*.91,y1);x.lineTo(x1+w1*.96,y1);x.lineTo(x2+w2*.96,y2);x.lineTo(x2+w2*.91,y2);x.fill();
      if(s.dk){x.fillStyle="#fff";[-.33,.33].forEach(l=>{x.beginPath();x.moveTo(x1+w1*l-w1*.016,y1);x.lineTo(x1+w1*l+w1*.016,y1);x.lineTo(x2+w2*l+w2*.015,y2);x.lineTo(x2+w2*l-w2*.015,y2);x.fill()})}
      if(s.rm>0||sn.rm>0){x.fillStyle=s.dk?"#facc15":"#fff";x.beginPath();x.moveTo(x1+w1,y1);x.lineTo(x1+w1*(1+s.rm*.22),y1);x.lineTo(x2+w2*(1+sn.rm*.22),y2);x.lineTo(x2+w2,y2);x.fill();x.fillStyle="#334155";x.beginPath();x.moveTo(x1+w1*(1+s.rm*.22),y1);x.lineTo(x1+w1*(1+s.rm*1.2),y1);x.lineTo(x2+w2*(1+sn.rm*1.2),y2);x.lineTo(x2+w2*(1+sn.rm*.22),y2);x.fill()}
    }
    if(s.lp){const ls=sc1*22e4;if(ls>6&&ls<700){const lx=x1-w1*1.04;x.fillStyle="#64748b";x.fillRect(lx-ls*.02,y1-ls,ls*.04,ls);x.fillRect(lx,y1-ls,ls*.18,ls*.03);if(ngt){x.fillStyle="rgba(254,240,138,.45)";x.beginPath();x.arc(lx+ls*.18,y1-ls*.98,ls*.18,0,Math.PI*2);x.fill()}}}
    if(s.sg){const ss=sc1*22e4;if(ss>6&&ss<650){const sx=x1+w1*1.15;x.fillStyle="#cbd5e1";x.fillRect(sx-ss*.05,y1-ss,ss*.1,ss);x.fillStyle="#1d4ed8";x.fillRect(sx-ss*.95,y1-ss*1.6,ss*1.9,ss*.68);x.strokeStyle="#fff";x.lineWidth=4;x.strokeRect(sx-ss*.95,y1-ss*1.6,ss*1.9,ss*.68);if(ss>20){x.fillStyle="#fff";x.font="bold "+Math.round(ss*.125)+"px Arial";x.textAlign="center";x.fillText("SORTIE ↗ TOTALENERGIES 200m",sx,y1-ss*1.22)}}}
    if(s.trA){const ts=sc1*15e4;if(ts>6&&ts<500){const tx=x1+w1*2.65;x.fillStyle="#78350f";x.fillRect(tx-ts*.07,y1-ts*.45,ts*.14,ts*.45);x.fillStyle=ngt?"#064e3b":"#16a34a";x.beginPath();x.arc(tx,y1-ts*.65,ts*.36,0,Math.PI*2);x.fill()}}
    if(s.ch)drawStation(x1,y1,w1,sc1);
    tr.forEach(v=>{const vi=Math.min(114,Math.max(0,Math.floor((v.z+(pos%L))/L)));if(vi===n)drawTraffic(v,pts[n])});
  }
  drawAudi(st,brk,rev,chg);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
