<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Audi A2 e-tron Paris</title>
<style>
  body{margin:0;overflow:hidden;background:#0f172a;font-family:Arial}
  canvas{display:block;width:100vw;height:100vh}
  #u{position:absolute;top:12px;left:12px;background:rgba(15,23,42,.9);color:#fff;padding:12px;border-radius:8px;border-left:4px solid #bb0a30;font-size:13px}
  #h{position:absolute;bottom:15px;right:15px;background:rgba(15,23,42,.92);color:#fff;padding:12px 18px;border-radius:10px;border-bottom:4px solid #bb0a30;font-size:15px;font-weight:bold}
</style>
</head>
<body>
<div id="u"><b>AUDI A2 e-tron • PARIS (326 ch)</b><br>Flèches / ZQSD : Tourner & Accélérer<br>Espace : Frein | TotalEnergies : Ralentir à droite</div>
<div id="h"><span id="s" style="font-size:28px">0</span> km/h | <span id="p">0</span>/326 ch<br>🔋 <span id="b">100% (450 km)</span> — <span id="t">PARIS</span></div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight;
onresize=()=>{W=c.width=innerWidth;H=c.height=innerHeight};
const segs=[],L=200,R=2200;
for(let i=0;i<1500;i++)segs.push({i,cv:(i>60&&i<180)?1.8:(i>250&&i<400)?-2.2:0,dk:Math.floor(i/3)%2==0,ch:i>20&&i%100==0,bl:i%8==0});
let pos=0,px=0,spd=0,bat=100,last=performance.now();
const k={};onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,brk=k[' ']||k.arrowdown||k.s,lft=k.arrowleft||k.q,rgt=k.arrowright||k.d;
  let hp=0;
  if(acc&&bat>0){spd+=8500*dt;hp=Math.min(326,Math.round(140+(spd/12600)*186))}
  else if(brk){spd-=11e3*dt;if(spd>200)hp=-120}
  else{spd-=2500*dt;if(spd>200)hp=-40}
  spd=Math.max(0,Math.min(spd,bat>0?12600:2100));
  pos=(pos+spd*dt)%(segs.length*L);
  const st=(lft?-1:(rgt?1:0));
  if(spd>10)px+=st*2.1*dt;
  const idx=Math.floor(pos/L)%segs.length,bs=segs[idx],rat=spd/12600;
  px=Math.max(-.95,Math.min(.95,px-bs.cv*rat*.4*dt));
  let chg=0;
  for(let o=-3;o<=3;o++)if(segs[(idx+o+segs.length)%segs.length].ch&&px>.35&&spd<4500)chg=1;
  if(chg){bat=Math.min(100,bat+35*dt);document.getElementById('t').innerText="⚡ TOTALENERGIES"}
  else if(acc&&bat>0){bat=Math.max(0,bat-(.4+rat*rat*1.8)*dt);document.getElementById('t').innerText="PARIS quattro"}
  else if(spd>200){bat=Math.min(100,bat+(brk?.4:.15)*rat*dt);document.getElementById('t').innerText="♻️ REGEN"}
  document.getElementById('s').innerText=Math.round(spd/60);
  document.getElementById('p').innerText=hp;
  document.getElementById('b').innerText=Math.ceil(bat)+"% ("+Math.round(bat*4.5)+" km)";
  const sky=x.createLinearGradient(0,0,0,H*.5);
  sky.addColorStop(0,"#0f172a");sky.addColorStop(.6,"#1e3a8a");sky.addColorStop(1,"#f97316");
  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);
  const ex=W*.5-px*140,ey=H*.5;
  x.strokeStyle="#f59e0b";x.lineWidth=3;
  x.beginPath();x.moveTo(ex-55,ey);x.quadraticCurveTo(ex-22,ey-80,ex-8,ey-200);x.lineTo(ex+8,ey-200);x.quadraticCurveTo(ex+22,ey-80,ex+55,ey);x.stroke();
  x.beginPath();x.arc(ex,ey,26,Math.PI,0);x.stroke();
  x.fillStyle="#f59e0b";x.fillRect(ex-35,ey-55,70,5);x.fillRect(ex-19,ey-115,38,4);
  x.beginPath();x.moveTo(ex,ey-200);x.lineTo(ex,ey-230);x.stroke();
  x.fillStyle="#475569";x.fillRect(0,H*.5,W,H*.5);
  let my=H,rx=0,dx=-(bs.cv*((pos%L)/L));
  for(let n=0;n<120;n++){
    const s=segs[(idx+n)%segs.length],z1=Math.max(10,(s.i*L)-(pos-(s.i<idx?segs.length*L:0))),z2=z1+L,sc1=.84/z1,sc2=.84/z2;
    const x1=W/2+sc1*((px*R)-rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2+sc2*((px*R)-rx-dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;
    rx+=dx;dx+=s.cv;if(y2>=my||y2>=y1)continue;
    x.fillStyle=s.dk?"#64748b":"#525e70";x.fillRect(0,y2,W,y1-y2);
    x.fillStyle=s.dk?"#1e293b":"#172033";x.beginPath();x.moveTo(x1-w1,y1);x.lineTo(x1+w1,y1);x.lineTo(x2+w2,y2);x.lineTo(x2-w2,y2);x.fill();
    if(s.dk){x.fillStyle="#fff";[-.33,.33].forEach(l=>{x.beginPath();x.moveTo(x1+w1*l-w1*.015,y1);x.lineTo(x1+w1*l+w1*.015,y1);x.lineTo(x2+w2*l+w2*.015,y2);x.lineTo(x2+w2*l-w2*.015,y2);x.fill()})}
    if(s.bl){const b=sc1*16e4;if(b>10&&b<600){x.fillStyle="#d6cfc2";x.fillRect(x1-w1*1.15-b*1.4,y1-b*1.8,b*1.4,b*1.8);x.fillStyle="#fef08a";x.fillRect(x1-w1*1.15-b,y1-b*1.4,b*.25,b*.35);if(!s.ch){x.fillStyle="#cfc7b8";x.fillRect(x1+w1*1.15,y1-b*1.8,b*1.4,b*1.8);x.fillStyle="#fef08a";x.fillRect(x1+w1*1.15+b*.3,y1-b*1.4,b*.25,b*.35)}}}
    if(s.ch){const cs=sc1*15e4;if(cs>8&&cs<450){const cx=x1+w1*1.25;x.fillStyle="rgba(237,28,36,.35)";x.beginPath();x.ellipse(x1+w1*.75,y1,w1*.35,cs*.15,0,0,Math.PI*2);x.fill();x.fillStyle="#fff";x.fillRect(cx-cs*.5,y1-cs*.95,cs,cs*.14);x.fillStyle="#ed1c24";x.fillRect(cx-cs*.5,y1-cs*.85,cs,cs*.05);x.fillStyle="#fff";x.fillRect(cx-cs*.12,y1-cs*.5,cs*.24,cs*.5);x.fillStyle="#ed1c24";x.fillRect(cx-cs*.12,y1-cs*.5,cs*.24,cs*.12);if(cs>40){x.font="bold "+Math.round(cs*.09)+"px Arial";x.textAlign="center";x.fillText("TotalEnergies",cx,y1-cs*.88)}}}
    my=y2;
  }
  x.save();x.translate(W/2+st*55,H-35);x.rotate(st*.06);
  x.fillStyle="#111";x.fillRect(-115,-45,32,56);x.fillRect(83,-45,32,56);
  x.fillStyle="#102a78";x.beginPath();x.moveTo(-112,-10);x.lineTo(-105,-78);x.lineTo(-74,-142);x.lineTo(74,-142);x.lineTo(105,-78);x.lineTo(112,-10);x.fill();
  x.fillStyle="#0f172a";x.beginPath();x.moveTo(-68,-135);x.lineTo(68,-135);x.lineTo(86,-82);x.lineTo(-86,-82);x.fill();
  x.fillStyle=brk?"#ff2a44":"#d9001b";x.fillRect(-98,-76,196,9);
  x.strokeStyle="#fff";x.lineWidth=2.5;[-18,-6,6,18].forEach(r=>{x.beginPath();x.arc(r,-56,6.5,0,Math.PI*2);x.stroke()});
  if(chg){x.strokeStyle="#ed1c24";x.lineWidth=5;x.beginPath();x.moveTo(108,-55);x.quadraticCurveTo(155,-25,195,-65);x.stroke()}
  x.restore();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
