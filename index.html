<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Audi A2 e-tron (326 ch) - Simulateur TotalEnergies</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #8bb4d9; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            background: rgba(12, 16, 24, 0.88); padding: 15px 20px; border-radius: 12px;
            border-left: 4px solid #bb0a30; box-shadow: 0 8px 25px rgba(0,0,0,0.5); z-index: 10;
        }
        h1 { margin: 0 0 4px 0; font-size: 18px; letter-spacing: 1px; }
        .badge-hp { display: inline-block; background: #bb0a30; color: white; font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 4px; margin-bottom: 8px; }
        p { margin: 4px 0; font-size: 13px; color: #ccc; }
        .btn-upload {
            display: inline-block; margin-top: 10px; padding: 7px 12px;
            background: #16389c; color: white; border-radius: 6px;
            font-size: 12px; font-weight: bold; cursor: pointer; border: none;
        }
        .btn-upload:hover { background: #1e4bd1; }
        input[type="file"] { display: none; }

        #btn-settings {
            position: absolute; top: 15px; right: 15px; color: white;
            background: rgba(12, 16, 24, 0.88); padding: 10px 16px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-weight: bold;
            font-size: 13px; z-index: 20;
        }
        #btn-settings:hover { background: #16389c; }

        #settings-panel {
            position: absolute; top: 60px; right: 15px; width: 280px; color: white;
            background: rgba(12, 16, 24, 0.95); padding: 18px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 20; display: none;
        }
        .setting-item { margin-bottom: 14px; }
        .setting-item label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .setting-item select, .setting-item button {
            width: 100%; padding: 7px; border-radius: 6px; background: #1e293b; color: white; border: 1px solid #334155;
        }
        .setting-item button { background: #16389c; cursor: pointer; font-weight: bold; border: none; padding: 9px; }

        #hud {
            position: absolute; bottom: 20px; right: 20px; color: white;
            background: rgba(12, 16, 24, 0.92); padding: 16px 24px; border-radius: 14px;
            border-bottom: 4px solid #bb0a30; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            z-index: 10; min-width: 250px;
        }
        .hud-row { display: flex; justify-content: space-between; align-items: baseline; }
        #speed { font-size: 38px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .unit { font-size: 14px; color: #5c85ff; }
        
        .power-meter { margin-top: 8px; }
        .power-header { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; font-weight: bold; }
        #hp-val { color: #f87171; }
        .hp-bar-bg { width: 100%; height: 6px; background: #262b36; border-radius: 3px; overflow: hidden; }
        #hp-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #ef4444); }

        .battery-box { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.15); }
        .bat-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; font-weight: bold; }
        #range-km { color: #4ade80; font-size: 15px; }
        .bar-bg { width: 100%; height: 10px; background: #262b36; border-radius: 5px; overflow: hidden; }
        #bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); }
        #power-status { font-size: 11px; margin-top: 6px; color: #94a3b8; text-align: right; }
        
        #alert-banner {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.92); color: white; padding: 10px 22px;
            border-radius: 30px; font-weight: bold; font-size: 14px; display: none; z-index: 20;
        }
    </style>
</head>
<body>
    <div id="alert-banner"></div>

    <div id="ui">
        <h1>AUDI A2 e-tron</h1>
        <div class="badge-hp">quattro • 326 ch (240 kW)</div>
        <p><strong>Flèches</strong> ou <strong>Z Q S D</strong> : Piloter</p>
        <p><strong>Espace</strong> : Freinage régénératif</p>
        <p><strong>Stations TotalEnergies</strong> : Ralentissez à droite</p>
        <label class="btn-upload">
            📸 Importer ma photo Audi
            <input type="file" id="imgUpload" accept="image/*">
        </label>
    </div>

    <button id="btn-settings">⚙️ Paramètres & Écran</button>
    <div id="settings-panel">
        <div class="setting-item">
            <label>Profil d'affichage</label>
            <select id="screen-profile">
                <option value="chromebook" selected>Écran Chromebook (Auto)</option>
                <option value="dell">Moniteur Dell P2419H (1920x1080)</option>
            </select>
        </div>
        <div class="setting-item">
            <label>Audi Drive Select (326 ch)</label>
            <select id="drive-mode">
                <option value="efficiency">Efficiency (Bridage 150 km/h • 200 ch)</option>
                <option value="comfort">Comfort (180 km/h • 260 ch)</option>
                <option value="dynamic" selected>Dynamic (V-Max 210 km/h • 326 ch)</option>
            </select>
        </div>
        <div class="setting-item">
            <button id="btn-recharge">⚡ Recharger batterie à 100 %</button>
        </div>
        <div class="setting-item" style="margin-bottom:0;">
            <button id="btn-fullscreen" style="background:#334155;">⛶ Plein écran</button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-row">
            <span style="font-size:12px; color:#94a3b8;">VITESSE</span>
            <div id="speed">0 <span class="unit">km/h</span></div>
        </div>
        
        <div class="power-meter">
            <div class="power-header">
                <span>PUISSANCE MOTEUR</span>
                <span id="hp-val">0 ch / 326 ch</span>
            </div>
            <div class="hp-bar-bg">
                <div id="hp-bar-fill"></div>
            </div>
        </div>

        <div class="battery-box">
            <div class="bat-header">
                <span id="bat-pct">🔋 100 %</span>
                <span id="range-km">450 km</span>
            </div>
            <div class="bar-bg">
                <div id="bar-fill"></div>
            </div>
            <div id="power-status">READY • e-tron quattro</div>
        </div>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let width = 1280;
        let height = 720;
        let screenMode = 'chromebook';

        function resize() {
            if (screenMode === 'dell') {
                width = 1920;
                height = 1080;
            } else {
                width = window.innerWidth || 1280;
                height = window.innerHeight || 720;
            }
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        const btnSettings = document.getElementById('btn-settings');
        const settingsPanel = document.getElementById('settings-panel');
        btnSettings.addEventListener('click', () => {
            settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
        });

        let drawDistance = 180;
        document.getElementById('screen-profile').addEventListener('change', (e) => {
            screenMode = e.target.value;
            drawDistance = (screenMode === 'dell') ? 240 : 180;
            resize();
        });

        let baseMaxSpeed = 12600;
        let maxHorsepower = 326;
        let accelPower = 8200;
        let consumptionFactor = 1.25;

        document.getElementById('drive-mode').addEventListener('change', (e) => {
            if (e.target.value === 'efficiency') {
                baseMaxSpeed = 9000;
                maxHorsepower = 200;
                accelPower = 5200;
                consumptionFactor = 0.7;
            } else if (e.target.value === 'comfort') {
                baseMaxSpeed = 10800;
                maxHorsepower = 260;
                accelPower = 6600;
                consumptionFactor = 0.95;
            } else {
                baseMaxSpeed = 12600;
                maxHorsepower = 326;
                accelPower = 8200;
                consumptionFactor = 1.25;
            }
        });

        document.getElementById('btn-recharge').addEventListener('click', () => {
            battery = 100.0;
            settingsPanel.style.display = 'none';
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
            setTimeout(resize, 200);
        });

        let customCarImg = null;
        document.getElementById('imgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() { customCarImg = img; };
