<!DOCTYPE html>
<html lang="fr">
<head>

<style>

</style>
</head>
<body>
<div id="cb">⚡ RECHARGE TOTALENERGIES 300 kW</div>
<div id="u"><b style="color:#60a5fa">AUDI A2 e-tron • AUTOROUTE A1 / A25</b><br><b>Flèches / ZQSD</b> : Conduire | <b>Bas / S</b> : Frein & Recul<br><b>M</b> : Mode | <b>N</b> : Nuit/Jour | <b>H</b> : Klaxon | <b>R</b> : Reset km | <b>V</b> : Bat 10%</div>
<div id="batBox">
  <div id="md" style="font-size:13px;font-weight:bold;color:#ef4444;letter-spacing:.5px">DYNAMIC • 326 ch</div>

  <div style="width:100%;height:7px;background:#334155;border-radius:4px;overflow:hidden;margin:6px 0"><div id="bBar" style="width:85%;height:100%;background:#4ade80"></div></div>

</div>

  <div style="font-size:12px;color:#94a3b8;letter-spacing:1px;margin-top:2px">KM/H</div>

</div>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=1280,H=720,ac=null,hn=0,mi=2,pos=0,px=0,spd=0,bat=85,dst=0,ngt=0,last=performance.now();
function fit(){W=c.width=innerWidth||1280;H=c.height=innerHeight||720}onresize=fit;fit();
function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
const segs=[],L=200,R=2200,N=600,TL=N*L;
for(let i=0;i<N;i++){let rm=0,sg=0,ch=0,trA=0,gt=0;if(i==42)gt=1;if(i==340)gt=2;if(i==85)sg=1;if(i>=95&&i<125)rm=(i-95)/30;if(i>=125&&i<=275)rm=1;if(i>275&&i<=305)rm=1-(i-275)/30;if(i==205)ch=1;if(i%4==0)trA=1;segs.push({i,cv:(i>320&&i<430)?1.1:(i>460&&i<560)?-1.3:0,dk:Math.floor(i/3)%2==0,rm,sg,ch,trA,gt})}
const tr=[{tk:1,z:1900,ln:.64,sp:4800,cl:"#f8fafc"},{tk:0,z:2400,ln:-.62,sp:7600,cl:"#1e293b"},{tk:0,z:4800,ln:-.1,sp:8800,cl:"#b91c1c"},{tk:1,z:7500,ln:.64,sp:4600,cl:"#e2e8f0"},{tk:0,z:3100,ln:-1.4,sp:-6500,cl:"#f1f5f9"},{tk:1,z:6400,ln:-1.45,sp:-5200,cl:"#ffffff"}];
const modes=[{n:"EFFICIENCY • 200 ch",ms:9000,hp:200,ac:5400,cn:.85,c:"#4ade80"},{n:"COMFORT • 260 ch",ms:10800,hp:260,ac:6800,cn:1,c:"#60a5fa"},{n:"DYNAMIC • 326 ch",ms:12600,hp:326,ac:8500,cn:1.15,c:"#ef4444"}];
const k={};
onkeydown=e=>{let v=e.key.toLowerCase();k[v]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(v))e.preventDefault();if(v=='v')bat=10;if(v=='n')ngt=1-ngt;if(v=='h'||v=='k')horn();if(v=='r')dst=0;if(v=='m'){mi=(mi+1)%3;let m=modes[mi],el=document.getElementById('md');el.innerText=m.n;el.style.color=m.c;document.getElementById('batBox').style.borderLeftColor=m.c}};
onkeyup=e=>{let v=e.key.toLowerCase();k[v]=0;if(v=='h'||v=='k')hn=0};
function drawGantry(x1,y1,w1,sc1,tp){
  const gs=sc1*22e4;if(gs<8||gs>900)return;

  x.fillStyle=pg;x.fillRect(x1-w1*1.02,y1-h,gs*.09,h);x.fillRect(x1+w1*.98,y1-h,gs*.09,h);
  x.fillStyle="#94a3b8";x.fillRect(x1-w1*1.02,y1-h*.86,w1*2.04,gs*.06);x.fillRect(x1-w1*1.02,y1-h*.66,w1*2.04,gs*.06);
  const bw=w1*.86,bh=gs*.52,bx=x1-w1*.16,by=y1-h*.98;

function drawStation(x1,y1,w1,sc1){
  const cs=sc1*22e4;if(cs<6||cs>650)return;

  x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(x1+w1*1.9,y1+4,w1*.85,cs*.35,0,0,Math.PI*2);x.fill();
  x.fillStyle="#cbd5e1";x.beginPath();x.ellipse(x1+w1*1.9,y1,w1*.78,cs*.32,0,0,Math.PI*2);x.fill();
  x.fillStyle="#dc2626";x.beginPath();x.ellipse(x1+w1*1.72,y1,w1*.48,cs*.22,0,0,Math.PI*2);x.fill();
  x.fillStyle="#f8fafc";x.fillRect(cx-cs*.85,y1-cs*1.12,cs*1.7,cs*.2);x.fillStyle="#ef4444";x.fillRect(cx-cs*.85,y1-cs*.96,cs*1.7,cs*.07);x.fillStyle="#2563eb";x.fillRect(cx-cs*.85,y1-cs*.89,cs*1.7,cs*.04);
  [-.55,.55].forEach(p=>{x.fillStyle="#334155";x.fillRect(cx+cs*p-cs*.05,y1-cs*.85,cs*.1,cs*.85)});
  [-.25,.25].forEach(b=>{x.fillStyle="#f8fafc";x.fillRect(cx+cs*b-cs*.09,y1-cs*.58,cs*.18,cs*.58);x.fillStyle="#0f172a";x.fillRect(cx+cs*b-cs*.06,y1-cs*.52,cs*.12,cs*.16);x.fillStyle="#38bdf8";x.fillRect(cx+cs*b-cs*.04,y1-cs*.5,cs*.08,cs*.08)});
  if(cs>28){x.fillStyle="#0f172a";x.font="bold "+Math.round(cs*.1)+"px Arial";x.textAlign="center";x.fillText("TotalEnergies • 300 kW",cx,y1-cs*1.01)}
}
function drawAudi(st,brk,rev,chg){
  x.save();x.translate(W/2+st*55,H-16);x.rotate(st*.045);
  if(ngt||hn){const bm=x.createLinearGradient(0,-170,0,-430);bm.addColorStop(0,hn?"rgba(255,255,255,.72)":"rgba(224,242,254,.45)");bm.addColorStop(1,"rgba(224,242,254,0)");x.fillStyle=bm;x.beginPath();x.moveTo(-105,-170);x.lineTo(-270,-430);x.lineTo(270,-430);x.lineTo(105,-170);x.fill()}
  x.fillStyle="rgba(0,0,0,.88)";x.beginPath();x.ellipse(0,10,180,28,0,0,Math.PI*2);x.fill();
  [-148,108].forEach(wx=>{x.fillStyle="#09090b";x.fillRect(wx,-62,40,68);for(let t=wx+6;t<wx+36;t+=6){x.fillStyle="#18181b";x.fillRect(t,-60,3,64)}});
  x.fillStyle="#090d16";x.beginPath();x.moveTo(-4,-192);x.lineTo(0,-206);x.lineTo(6,-192);x.fill();
  [-142,120].forEach(mx=>{x.fillStyle="#090d16";x.fillRect(mx,-136,22,12);x.fillStyle="#1d4ed8";x.fillRect(mx+2,-138,18,7)});
  const bg=x.createLinearGradient(0,-195,0,-22);bg.addColorStop(0,"#60a5fa");bg.addColorStop(.18,"#2563eb");bg.addColorStop(.48,"#1e3a8a");bg.addColorStop(.78,"#172554");bg.addColorStop(1,"#090d16");
  x.fillStyle=bg;x.beginPath();x.moveTo(-148,-36);x.quadraticCurveTo(-152,-82,-134,-120);x.lineTo(-102,-182);x.quadraticCurveTo(0,-198,102,-182);x.lineTo(134,-120);x.quadraticCurveTo(152,-82,148,-36);x.lineTo(136,-22);x.lineTo(-136,-22);x.fill();
  const wg=x.createLinearGradient(0,-184,0,-128);wg.addColorStop(0,"#020617");wg.addColorStop(.45,"#334155");wg.addColorStop(1,"#090d16");
  x.fillStyle=wg;x.beginPath();x.moveTo(-94,-180);x.quadraticCurveTo(0,-190,94,-180);x.lineTo(116,-132);x.quadraticCurveTo(0,-124,-116,-132);x.fill();
  x.fillStyle="rgba(255,255,255,.22)";x.beginPath();x.moveTo(-68,-142);x.lineTo(-14,-93);x.lineTo(18,-93);x.lineTo(-42,-144);x.fill();
  x.fillStyle="#1e40af";x.beginPath();x.moveTo(-114,-138);x.quadraticCurveTo(0,-144,114,-138);x.lineTo(118,-131);x.quadraticCurveTo(0,-136,-118,-131);x.fill();
  x.fillStyle="#090d16";x.fillRect(-132,-120,264,14);
  const lc=(brk||rev)?"#ff1e38":"#dc2626";x.fillStyle=lc;x.fillRect(-130,-116,260,3.5);
  [-124,-108,-92,-76,-60,-44,32,48,64,80,96,112].forEach(lx=>{x.fillRect(lx,-110,11,3)});
  if(spd<-10){x.fillStyle="#fff";x.fillRect(-118,-111,26,3);x.fillRect(92,-111,26,3)}
  x.strokeStyle="#e2e8f0";x.lineWidth=1.8;[-17,-5.5,5.5,17].forEach(r=>{x.beginPath();x.arc(r,-113,6.5,0,Math.PI*2);x.stroke()});
  x.fillStyle="#0f172a";x.font="bold 9px Arial";x.textAlign="left";x.fillText("A2 e-tron",-114,-82);
  x.fillStyle="#090d16";x.beginPath();x.moveTo(-138,-34);x.lineTo(-124,-66);x.lineTo(124,-66);x.lineTo(138,-34);x.lineTo(126,-16);x.lineTo(-126,-16);x.fill();
  x.fillStyle="#f8fafc";x.fillRect(-48,-59,96,18);x.fillStyle="#0f172a";x.font="bold 10px Arial";x.textAlign="center";x.fillText("A2 e-tron",0,-46);
  x.fillStyle="#b91c1c";x.beginPath();x.moveTo(-132,-38);x.lineTo(-125,-56);x.lineTo(-120,-56);x.lineTo(-126,-38);x.fill();
  x.beginPath();x.moveTo(132,-38);x.lineTo(125,-56);x.lineTo(120,-56);x.lineTo(126,-38);x.fill();
  x.fillStyle="#18181b";x.fillRect(-118,-26,236,12);
  if(chg){x.strokeStyle="#4ade80";x.lineWidth=6;x.beginPath();x.moveTo(142,-82);x.quadraticCurveTo(188,-40,228,-85);x.stroke()}
  x.restore();
}
function drawTree(tx,y1,ts){
  if(ts<6||ts>650)return;
  x.fillStyle="#451a03";x.fillRect(tx-ts*.06,y1-ts*.5,ts*.12,ts*.5);
  const fg=x.createRadialGradient(tx-ts*.1,y1-ts*.85,ts*.05,tx,y1-ts*.75,ts*.46);
  fg.addColorStop(0,ngt?"#065f46":"#4d7c0f");fg.addColorStop(.6,ngt?"#064e3b":"#365314");fg.addColorStop(1,ngt?"#022c22":"#1a2e05");
  x.fillStyle=fg;x.beginPath();x.arc(tx,y1-ts*.78,ts*.42,0,Math.PI*2);x.arc(tx-ts*.24,y1-ts*.64,ts*.28,0,Math.PI*2);x.arc(tx+ts*.24,y1-ts*.64,ts*.28,0,Math.PI*2);x.fill();
}
function drawTraffic(v,p){
  const vx=p.x1+v.ln*p.w1,w=p.sc1*(v.tk?2150:1550),h=p.sc1*(v.tk?3150:1150);
  if(w<4||p.y1>H+60)return;
  x.save();x.translate(vx,p.y1);
  x.fillStyle="rgba(0,0,0,.65)";x.beginPath();x.ellipse(0,5,w*.6,h*.1,0,0,Math.PI*2);x.fill();
  x.fillStyle="#09090b";x.fillRect(-w*.46,-h*.22,w*.17,h*.22);x.fillRect(w*.29,-h*.22,w*.17,h*.22);
  const g=x.createLinearGradient(0,-h,0,0);g.addColorStop(0,v.cl);g.addColorStop(.55,"#cbd5e1");g.addColorStop(1,"#475569");
  x.fillStyle=g;x.fillRect(-w*.48,-h,w*.96,h*.86);
  if(v.tk){
    if(v.sp<0){x.fillStyle="#0f172a";x.fillRect(-w*.42,-h*.75,w*.84,h*.24);x.fillStyle="#090d16";x.fillRect(-w*.36,-h*.42,w*.72,h*.22);x.fillStyle="#fef08a";x.fillRect(-w*.45,-h*.28,w*.18,h*.08);x.fillRect(w*.27,-h*.28,w*.18,h*.08)}
    else{x.strokeStyle="#64748b";x.lineWidth=1.5;x.strokeRect(-w*.42,-h*.94,w*.4,h*.74);x.strokeRect(w*.02,-h*.94,w*.4,h*.74);x.fillStyle="#1e293b";x.fillRect(-w*.48,-h*.18,w*.96,h*.08);x.fillStyle="#ef4444";x.fillRect(-w*.45,-h*.16,w*.2,h*.05);x.fillRect(w*.25,-h*.16,w*.2,h*.05)}
    if(w>16){x.strokeStyle="#0f172a";x.lineWidth=2;x.beginPath();x.arc(0,-h*.56,w*.12,0,Math.PI*2);x.stroke();x.fillStyle="#0f172a";x.font="bold "+Math.round(w*.095)+"px Arial";x.textAlign="center";x.fillText("MERCEDES",0,-h*.82)}
  }else{
    x.fillStyle="#020617";x.fillRect(-w*.36,-h*.9,w*.72,h*.36);
    x.fillStyle=v.sp<0?"#fef08a":"#ff1e1e";x.fillRect(-w*.44,-h*.48,w*.88,h*.07);
  }
  x.restore();
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d,m=modes[mi],maxS=bat>0?m.ms:2100;let hp=0;
  if(brk){spd*=.85;if(Math.abs(spd)<30)spd=0}else if(acc&&bat>0){spd+=m.ac*dt;hp=Math.min(m.hp,Math.round(m.hp*.42+(spd/m.ms)*m.hp*.58))}else if(rev&&bat>0){if(spd>50){spd-=11e3*dt;hp=-120}else{spd-=3500*dt;hp=85}}else{spd-=750*dt*(spd>0?1:-1);if(Math.abs(spd)<25)spd=0;if(spd>200)hp=-25}
  spd=Math.max(-2100,Math.min(spd,maxS));pos=(pos+spd*dt+TL)%TL;const stepKm=Math.abs(spd/60)*(dt/3600)*10;dst+=stepKm;
  const idx=Math.floor(pos/L)%N,bs=segs[idx],maxR=.92+bs.rm*1.45,st=lft?-1:(rgt?1:0);
  if(Math.abs(spd)>10)px+=st*1.85*(spd>=0?1:-1)*dt;px-=bs.cv*(spd/12600)*.4*dt;if(px>maxR)px=Math.max(maxR,px-2.2*dt);if(px<-.92)px=-.92;
  tr.forEach(v=>{v.z+=(v.sp-spd)*dt;if(v.z<280)v.z=19000;if(v.z>20000)v.z=400});
  let chg=0;for(let o=-18;o<=18;o++)if(segs[(idx+o+N)%N].ch&&px>1.02&&Math.abs(spd)<4800)chg=1;
  const cb=document.getElementById('cb');
  if(chg){bat=Math.min(100,bat+(bat>80?2.2:4.5)*dt);cb.style.display="block";cb.innerText="⚡ RECHARGE TOTALENERGIES : "+Math.ceil(bat)+"%"}
  else{cb.style.display="none";if(acc&&bat>0)bat=Math.max(0,bat-(stepKm/4.5)*m.cn);else if(spd>200)bat=Math.min(100,bat+(stepKm/4.5)*(rev?.4:.15))}
  const g=document.getElementById('g');g.innerText=spd<-10?"R":"D";g.style.background=spd<-10?"#f59e0b":"#dc2626";
  document.getElementById('s').innerText=Math.abs(Math.round(spd/60));document.getElementById('p').innerText=hp;
  const bPct=Math.ceil(bat);document.getElementById('b').innerText=bPct+"%";document.getElementById('rng').innerText=Math.round(bat*4.5);document.getElementById('o').innerText=dst.toFixed(1);
  const bBar=document.getElementById('bBar');bBar.style.width=bPct+"%";bBar.style.background=bPct<20?"#ef4444":(bPct<50?"#f59e0b":"#4ade80");
  const sky=x.createLinearGradient(0,0,0,H*.5);if(ngt){sky.addColorStop(0,"#020617");sky.addColorStop(1,"#0f172a")}else{sky.addColorStop(0,"#0369a1");sky.addColorStop(.55,"#38bdf8");sky.addColorStop(.88,"#bae6fd");sky.addColorStop(1,"#f8fafc")}
  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);if(ngt){x.fillStyle="#fff";for(let i=0;i<30;i++)x.fillRect((i*197)%W,(i*83)%(H*.42),2,2)}else{[[.18,.18,95],[.52,.13,125],[.8,.21,90],[.34,.26,75]].forEach(cl=>{const cg=x.createRadialGradient(W*cl[0],H*cl[1],10,W*cl[0],H*cl[1],cl[2]);cg.addColorStop(0,"rgba(255,255,255,.92)");cg.addColorStop(.65,"rgba(241,245,249,.55)");cg.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=cg;x.beginPath();x.arc(W*cl[0],H*cl[1],cl[2],0,Math.PI*2);x.fill()})}
  const hg=x.createLinearGradient(0,H*.43,0,H*.5);hg.addColorStop(0,ngt?"#090d16":"#475569");hg.addColorStop(1,ngt?"#020617":"#365314");
  x.fillStyle=hg;x.beginPath();x.moveTo(0,H*.5);x.lineTo(0,H*.47);x.quadraticCurveTo(W*.22,H*.43,W*.48,H*.475);x.quadraticCurveTo(W*.76,H*.42,W,H*.465);x.lineTo(W,H*.5);x.fill();
  x.fillStyle=ngt?"#090d16":"#3f6212";x.fillRect(0,H*.5,W,H*.5);
  let rx=0,dx=-(bs.cv*((pos%L)/L)),pts=[];
  for(let n=0;n<115;n++){
    const s=segs[(idx+n)%N],sn=segs[(idx+n+1)%N],z1=Math.max(10,n*L-(pos%L)),z2=z1+L,sc1=.84/z1,sc2=.84/z2;
    const x1=W/2-sc1*((px*R)+rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2-sc2*((px*R)+rx+dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;
    pts.push({n,s,sn,x1,y1,w1,x2,y2,w2,sc1});rx+=dx;dx+=s.cv;
  }
  for(let i=pts.length-1;i>=0;i--){
    const {s,sn,x1,y1,w1,x2,y2,w2,sc1}=pts[i];
    if(y1>y2){
