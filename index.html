<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Audi A2 e-tron • Autoroute A1</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  #scene { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #bg { width: 100%; height: 100%; object-fit: cover; transition: transform 0.1s ease-out, filter 0.3s; }
  #u { position: absolute; top: 16px; left: 16px; background: rgba(15,23,42,.85); color: #fff; padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); font-size: 13px; line-height: 1.45; }
  #batBox { position: absolute; bottom: 20px; left: 20px; background: rgba(15,23,42,.88); color: #fff; padding: 16px 22px; border-radius: 16px; border: 1px solid rgba(255,255,255,.25); border-left: 6px solid #ef4444; min-width: 230px; }
  #gtDial { position: absolute; bottom: 20px; right: 20px; width: 164px; height: 164px; border-radius: 50%; background: radial-gradient(circle, rgba(30,41,59,.92) 55%, rgba(15,23,42,.98) 100%); border: 4px solid rgba(255,255,255,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
</style>
</head>
<body>
<div id="scene">
  <img id="bg" src="décor.png" alt="Audi A2 e-tron">
  <div id="u"><b style="color:#60a5fa">AUDI A2 e-tron • AUTOROUTE A1 / A25</b><br><b>Flèches / ZQSD</b> : Accélérer & Tourner | <b>Bas / S</b> : Freiner<br><b>M</b> : Mode | <b>N</b> : Nuit/Jour | <b>R</b> : Reset km | <b>V</b> : Bat 10%</div>
  <div id="batBox">
    <div id="md" style="font-size:13px;font-weight:bold;color:#ef4444">DYNAMIC • 326 ch</div>
    <div style="font-size:22px;font-weight:bold;margin:4px 0">🔋 <span id="b">85%</span> <span style="font-size:15px;color:#cbd5e1;font-weight:normal">(<span id="rng">382</span> km)</span></div>
    <div style="width:100%;height:7px;background:#334155;border-radius:4px;overflow:hidden;margin:6px 0"><div id="bBar" style="width:85%;height:100%;background:#4ade80"></div></div>
    <div style="font-size:14px;color:#e2e8f0">🛣️ Distance : <b id="o">14.2</b> km</div>
  </div>
  <div id="gtDial">
    <div id="g" style="background:#dc2626;padding:2px 10px;border-radius:6px;font-weight:bold;font-size:15px;margin-bottom:2px">D</div>
    <div id="s" style="font-size:44px;font-weight:900;line-height:1">0</div>
    <div style="font-size:12px;color:#94a3b8">KM/H</div>
    <div style="font-size:11px;color:#60a5fa;margin-top:4px"><span id="p">0</span> ch</div>
  </div>
</div>
<script>
const bg = document.getElementById('bg');
const modes = [
  { n: "EFFICIENCY • 200 ch", max: 150, hp: 200, acc: 28, c: "#4ade80" },
  { n: "COMFORT • 260 ch", max: 180, hp: 260, acc: 38, c: "#60a5fa" },
  { n: "DYNAMIC • 326 ch", max: 210, hp: 326, acc: 52, c: "#ef4444" }
];
let mi = 2, spd = 0, bat = 85, dst = 14.2, tilt = 0, ngt = false, last = performance.now();
const k = {};
onkeydown = e => {
  const v = e.key.toLowerCase(); k[v] = 1;
  if (v === 'v') bat = 10;
  if (v === 'r') dst = 0;
  if (v === 'n') { ngt = !ngt; bg.style.filter = ngt ? "brightness(0.35) contrast(1.2)" : "none"; }
  if (v === 'm') {
    mi = (mi + 1) % 3; const m = modes[mi];
    const el = document.getElementById('md'); el.innerText = m.n; el.style.color = m.c;
    document.getElementById('batBox').style.borderLeftColor = m.c;
  }
};
onkeyup = e => { k[e.key.toLowerCase()] = 0; };
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const acc = k.arrowup || k.z, brk = k.arrowdown || k.s || k[' '], lft = k.arrowleft || k.q, rgt = k.arrowright || k.d;
  const m = modes[mi];
  if (brk) spd = Math.max(0, spd - 95 * dt);
  else if (acc && bat > 0) spd = Math.min(m.max, spd + m.acc * dt);
  else spd = Math.max(0, spd - 18 * dt);
  const st = (lft ? -1 : 0) + (rgt ? 1 : 0);
  tilt += (st * 2.5 - tilt) * 6 * dt;
  const zoom = 1 + (spd / 210) * 0.08 + Math.sin(now * 0.03) * (spd > 5 ? 0.002 : 0);
  bg.style.transform = `scale(${zoom}) translateX(${-tilt * 12}px) rotate(${tilt * 0.4}deg)`;
  const kmStep = (spd * dt) / 3600; dst += kmStep;
  if (acc && bat > 0) bat = Math.max(0, bat - kmStep * 0.22);
  document.getElementById('s').innerText = Math.round(spd);
  document.getElementById('p').innerText = acc ? Math.round((spd / m.max) * m.hp) : 0;
  document.getElementById('b').innerText = Math.ceil(bat) + "%";
  document.getElementById('rng').innerText = Math.round(bat * 4.5);
  document.getElementById('o').innerText = dst.toFixed(1);
  const bBar = document.getElementById('bBar'); bBar.style.width = Math.ceil(bat) + "%";
  bBar.style.background = bat < 20 ? "#ef4444" : (bat < 50 ? "#f59e0b" : "#4ade80");
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
