<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Audi A2 e-tron Paris - Édition Autoroute</title>
<style>
body{margin:0;overflow:hidden;background:#0f172a;font-family:Arial}
canvas{display:block;width:100vw;height:100vh}
#u{position:absolute;top:10px;left:10px;background:rgba(15,23,42,.92);color:#fff;padding:10px 12px;border-radius:8px;border-left:4px solid #bb0a30;font-size:12px;line-height:1.4}
#h{position:absolute;bottom:15px;right:15px;background:rgba(15,23,42,.94);color:#fff;padding:12px 16px;border-radius:10px;border-bottom:4px solid #bb0a30;font-size:14px;font-weight:bold;min-width:235px}
#cb{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 20px;border-radius:20px;font-weight:bold;display:none;z-index:20}
</style>
</head>
<body>
<div id="cb">⚡ RECHARGE TOTALENERGIES</div>
<div id="u"><b>AUDI A2 e-tron • PARIS (326 ch)</b><br>Flèches/ZQSD: Piloter | Bas/S: Frein & Recul<br><b>M</b>: Mode (Efficiency / Comfort / Dynamic)<br><b>N</b>: Nuit/Phares | <b>H</b>: Klaxon | <b>V</b>: Batterie 10%</div>
<div id="h"><span id="g" style="background:#bb0a30;padding:2px 6px;border-radius:4px">D</span> <span id="s" style="font-size:26px">0</span> km/h | <span id="p">0</span>/<span id="mp">326</span> ch<br><div id="md" style="font-size:12px;color:#ef4444;margin:4px 0">MODE : DYNAMIC (210 km/h)</div>🔋 <span id="b">85% (382 km)</span><br>🛣️ <span id="o">0.0</span> km</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight;onresize=()=>{W=c.width=innerWidth;H=c.height=innerHeight};
let ac=null,hn=0;
function horn(){if(hn)return;hn=1;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o1=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();o1.type=o2.type='sawtooth';o1.frequency.value=410;o2.frequency.value=515;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o1.connect(g);o2.connect(g);g.connect(ac.destination);o1.start();o2.start();o1.stop(ac.currentTime+.35);o2.stop(ac.currentTime+.35)}catch(e){}}

// Construction route : Panneau à 345, ouverture bretelle 365->415, station TotalEnergies pile au milieu à 390
const segs=[],L=200,R=2200,N=1800,TL=N*L;
for(let i=0;i<N;i++){
  let m=i%450,rm=0,sg=0,ch=0;
  if(i>100){
    if(m==345)sg=1; // Panneau bleu juste avant la sortie
    if(m>=365&&m<380)rm=(m-365)/15; // Ouverture bretelle
    if(m>=380&&m<=402)rm=1; // Plateforme station TotalEnergies
    if(m>402&&m<=417)rm=1-(m-402)/15; // Fermeture bretelle
    if(m==391)ch=1; // Station TotalEnergies au milieu de la plateforme
  }
  segs.push({i,cv:(i>80&&i<220)?1.4:(i>480&&i<640)?-1.6:0,dk:Math.floor(i/3)%2==0,rm,sg,ch});
}

// Trafic dynamique : Camions Mercedes (droite) & Audi (milieu/gauche) toujours maintenus devant le joueur
const tr=[],cl=["#9ca3af","#fff","#1e293b","#dc2626"];
for(let j=0;j<16;j++){
  let tk=(j%2==0); // 1 camion Mercedes sur 2 véhicules
  tr.push({tk,z:(j+1)*1400,ln:tk?.60:(j%4==1?0:-.60),sp:tk?5200:7600,cl:tk?"#f1f5f9":cl[j%4]});
}

const modes=[
  {n:"EFFICIENCY (150 km/h)",ms:9000,hp:200,ac:5400,cn:.55,c:"#4ade80"},
  {n:"COMFORT (180 km/h)",ms:10800,hp:260,ac:6800,cn:.95,c:"#60a5fa"},
  {n:"DYNAMIC (210 km/h)",ms:12600,hp:326,ac:8500,cn:1.4,c:"#ef4444"}
];
let mi=2,pos=0,px=0,spd=0,bat=85,dst=0,ngt=0,last=performance.now();
const k={};
onkeydown=e=>{
  let v=e.key.toLowerCase();k[v]=1;
  if(v=='v')bat=10;if(v=='n')ngt=1-ngt;if(v=='h'||v=='k')horn();
  if(v=='m'){mi=(mi+1)%3;let m=modes[mi],el=document.getElementById('md');el.innerText="MODE : "+m.n;el.style.color=m.c;document.getElementById('mp').innerText=m.hp;}
};
onkeyup=e=>{let v=e.key.toLowerCase();k[v]=0;if(v=='h'||v=='k')hn=0};

function loop(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const acc=k.arrowup||k.z,rev=k.arrowdown||k.s,brk=k[' '],lft=k.arrowleft||k.q,rgt=k.arrowright||k.d;
  const m=modes[mi],maxS=bat>0?m.ms:2100;let hp=0;
  if(brk){spd*=.85;if(Math.abs(spd)<30)spd=0}
  else if(acc&&bat>0){spd+=m.ac*dt;hp=Math.min(m.hp,Math.round(m.hp*.42+(spd/m.ms)*m.hp*.58))}
  else if(rev&&bat>0){if(spd>50){spd-=11e3*dt;hp=-120}else{spd-=3500*dt;hp=85}}
  else{spd*=.97;if(Math.abs(spd)<15)spd=0;if(spd>200)hp=-40}
  spd=Math.max(-2100,Math.min(spd,maxS));pos=(pos+spd*dt+TL)%TL;dst+=Math.abs(spd/60)*(dt/3600)*12;

  const idx=Math.floor(pos/L)%N,bs=segs[idx],rat=Math.abs(spd)/12600,maxR=.92+bs.rm*.95,st=lft?-1:(rgt?1:0);
  if(Math.abs(spd)>10)px+=st*1.85*(spd>=0?1:-1)*dt;px-=bs.cv*(spd/12600)*.4*dt;
  if(px>maxR)px=Math.max(maxR,px-2.2*dt);if(px<-.92)px=-.92;

  // Mise à jour trafic relatif au joueur pour qu'il y ait toujours des camions Mercedes et Audi visibles
  tr.forEach(v=>{
    v.z=(v.z+v.sp*dt)%TL;
    let dz=(v.z-pos+TL)%TL;
    if(dz>TL-1500){v.z=(pos+22000+Math.random()*4000)%TL;dz=22000;} // Replace devant dès qu'on le dépasse
    if(dz<360 && Math.abs(px-v.ln)<.24 && spd>v.sp)spd=v.sp*.85;
  });

  // Détection recharge pile au milieu de la bretelle
  let chg=0;for(let o=-9;o<=9;o++)if(segs[(idx+o+N)%N].ch&&px>.95&&Math.abs(spd)<4800)chg=1;
  const cb=document.getElementById('cb');
  if(chg){
    let rate=bat>80?2.2:4.5;
    bat=Math.min(100,bat+rate*dt);cb.style.display="block";cb.innerText="⚡ CHARGE TOTALENERGIES ("+(bat>80?"85 kW":"175 kW")+") : "+Math.ceil(bat)+"%";
  }else{
    cb.style.display="none";
    if(acc&&bat>0)bat=Math.max(0,bat-(.35+rat*rat*1.5)*m.cn*dt);
    else if(spd>200)bat=Math.min(100,bat+(rev?.4:.15)*rat*dt);
  }

  const g=document.getElementById('g');g.innerText=spd<-10?"R":"D";g.style.background=spd<-10?"#f59e0b":"#bb0a30";
  document.getElementById('s').innerText=Math.abs(Math.round(spd/60));document.getElementById('p').innerText=hp;
  document.getElementById('b').innerText=Math.ceil(bat)+"% ("+Math.round(bat*4.5)+" km)";document.getElementById('o').innerText=dst.toFixed(1);

  const sky=x.createLinearGradient(0,0,0,H*.5);
  if(ngt){sky.addColorStop(0,"#020617");sky.addColorStop(1,"#0f172a")}else{sky.addColorStop(0,"#0f172a");sky.addColorStop(.6,"#1e3a8a");sky.addColorStop(1,"#f97316")}
  x.fillStyle=sky;x.fillRect(0,0,W,H*.5);
  if(ngt){x.fillStyle="#fff";for(let i=0;i<30;i++)x.fillRect((i*197)%W,(i*83)%(H*.42),2,2)}

  const ex=W*.5-px*110,ey=H*.5;x.strokeStyle="#f59e0b";x.lineWidth=3;
  x.beginPath();x.moveTo(ex-55,ey);x.quadraticCurveTo(ex-22,ey-80,ex-8,ey-200);x.lineTo(ex+8,ey-200);x.quadraticCurveTo(ex+22,ey-80,ex+55,ey);x.stroke();
  x.beginPath();x.arc(ex,ey,26,Math.PI,0);x.stroke();x.fillStyle="#f59e0b";x.fillRect(ex-35,ey-55,70,5);x.fillRect(ex-19,ey-115,38,4);

  x.fillStyle=ngt?"#090d16":"#334155";x.fillRect(0,H*.5,W,H*.5);

  let my=H,rx=0,dx=-(bs.cv*((pos%L)/L)),pj=[];
  for(let n=0;n<115;n++){
    const s=segs[(idx+n)%N],sn=segs[(idx+n+1)%N],z1=Math.max(10,((s.i-idx+N)%N)*L-(pos%L)),z2=z1+L,sc1=.84/z1,sc2=.84/z2;
    const x1=W/2-sc1*((px*R)+rx)*W/2,y1=H/2+sc1*1e3*H/2,w1=sc1*R*W/2,x2=W/2-sc2*((px*R)+rx+dx)*W/2,y2=H/2+sc2*1e3*H/2,w2=sc2*R*W/2;
    pj[n]={x1,y1,w1,sc1};rx+=dx;dx+=s.cv;if(y2>=my||y2>=y1)continue;

    x.fillStyle=ngt?(s.dk?"#142608":"#0f1d06"):(s.dk?"#3f6212":"#365314");x.fillRect(0,y2,W,y1-y2);
    x.fillStyle=ngt?(s.dk?"#0f172a":"#090e1a"):(s.dk?"#1e293b":"#172033");x.beginPath();x.moveTo(x1-w1,y1);x.lineTo(x1+w1,y1);x.lineTo(x2+w2,y2);x.lineTo(x2-w2,y2);x.fill();

    if(s.dk){x.fillStyle="#fff";[-.33,.33].forEach(l=>{x.beginPath();x.moveTo(x1+w1*l-w1*.015,y1);x.lineTo(x1+w1*l+w1*.015,y1);x.lineTo(x2+w2*l+w2*.015,y2);x.lineTo(x2+w2*l-w2*.015,y2);x.fill()})}
    if(s.rm>0||sn.rm>0){
      x.fillStyle=s.dk?"#fff":"#334155";x.beginPath();x.moveTo(x1+w1,y1);x.lineTo(x1+w1*(1+s.rm*.18),y1);x.lineTo(x2+w2*(1+sn.rm*.18),y2);x.lineTo(x2+w2,y2);x.fill();
      x.fillStyle=s.dk?"#273549":"#1e293b";x.beginPath();x.moveTo(x1+w1*(1+s.rm*.18),y1);x.lineTo(x1+w1*(1+s.rm*.95),y1);x.lineTo(x2+w2*(1+sn.rm*.95),y2);x.lineTo(x2+w2*(1+sn.rm*.18),y2);x.fill();
    }
    // Panneau bleu autoroutier bien visible
    if(s.sg){
      const ss=sc1*16e4;
      if(ss>8&&ss<500){
        const sx=x1+w1*1.15;
        x.fillStyle="#94a3b8";x.fillRect(sx-ss*.03,y1-ss*.95,ss*.06,ss*.95);
        x.fillStyle="#1d4ed8";x.fillRect(sx-ss*.65,y1-ss*1.35,ss*1.3,ss*.48);
        x.strokeStyle="#fff";x.lineWidth=2;x.strokeRect(sx-ss*.65,y1-ss*1.35,ss*1.3,ss*.48);
        if(ss>28){
          x.fillStyle="#fff";x.font="bold "+Math.round(ss*.095)+"px Arial";x.textAlign="center";
          x.fillText("SORTIE ↗",sx,y1-ss*1.16);
          x.fillStyle="#fde047";x.fillText("TOTALENERGIES ⚡",sx,y1-ss*.99);
        }
      }
    }
    // Station TotalEnergies alignée sur la bretelle
    if(s.ch){
      const cs=sc1*16e4;
      if(cs>8&&cs<500){
        const cx=x1+w1*2.1;
        x.fillStyle="rgba(237,28,36,.6)";x.beginPath();x.ellipse(x1+w1*1.5,y1,w1*.42,cs*.25,0,0,Math.PI*2);x.fill();
        x.fillStyle="#fff";x.fillRect(cx-cs*.55,y1-cs,cs*1.1,cs*.16);
        x.fillStyle="#ed1c24";x.fillRect(cx-cs*.55,y1-cs*.88,cs*1.1,cs*.06);
        x.fillStyle="#e2e8f0";x.fillRect(cx-cs*.45,y1-cs*.82,cs*.06,cs*.82);x.fillRect(cx+cs*.38,y1-cs*.82,cs*.06,cs*.82);
        x.fillStyle="#fff";x.fillRect(cx-cs*.14,y1-cs*.55,cs*.28,cs*.55);
        x.fillStyle="#ed1c24";x.fillRect(cx-cs*.14,y1-cs*.55,cs*.28,cs*.14);
        if(cs>32){x.font="bold "+Math.round(cs*.095)+"px Arial";x.textAlign="center";x.fillText("TotalEnergies",cx,y1-cs*.91);}
      }
    }
    my=y2;
  }

  // Affichage du trafic Audi et Camions Mercedes
  for(let n=110;n>=1;n--){
    const p=pj[n];if(!p)continue;
    tr.forEach(v=>{
      let dz=(v.z-pos+TL)%TL;
      if(Math.floor(dz/L)==n){
        const vx=p.x1+v.ln*p.w1,w=p.sc1*(v.tk?1650:1350),h=p.sc1*(v.tk?2450:950);
        if(w>5){
          x.save();x.translate(vx,p.y1);
          x.fillStyle="#111";x.fillRect(-w*.46,-h*.25,w*.16,h*.25);x.fillRect(w*.3,-h*.25,w*.16,h*.25);
          x.fillStyle=v.cl;x.fillRect(-w*.48,-h,w*.96,h*.85);
